  const viewer     = $('#viewer');
  const panel      = $('#viewerPanel');
  const stage      = $('#viewerStage');
  const closeBtn   = $('#viewerClose');
  const scrim      = $('#viewerScrim');
  let isOpen = false, activeCard = null, activeKind = null, lastFocus = null, token = 0;
  let currentPluginManifest = null;

  const ICON_CLOSE = '✕';
  const ICON_BACK  =
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>';

  let viewerSubMode = 'list';
  let viewerReturnToCenter = true;

  function setCloseBtnMode(mode) {
    if (mode === 'back') {
      closeBtn.setAttribute('aria-label', '返回插件中心');
      closeBtn.setAttribute('title', '返回插件中心');
      closeBtn.innerHTML = ICON_BACK;
      closeBtn.classList.add('is-back');
    } else {
      closeBtn.setAttribute('aria-label', '关闭');
      closeBtn.setAttribute('title', '关闭');
      closeBtn.innerHTML = ICON_CLOSE;
      closeBtn.classList.remove('is-back');
    }
  }

  function measureCard(card) {
    if (!card || !card.isConnected) {
      const w = vw(), h = vh();
      const size = Math.min(w, h) * 0.22;
      return {
        left: Math.round((w - size) / 2),
        top:  Math.round((h - size) / 2),
        width: size, height: size
      };
    }
    const savedTransform  = card.style.transform;
    const savedTransition = card.style.transition;
    card.__tiltLock = true;
    card.style.transition = 'none';
    card.style.transform  = 'none';
    const rect = card.getBoundingClientRect();
    card.style.transform  = savedTransform;
    card.style.transition = savedTransition;
    card.__tiltLock = false;
    return { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
  }
  function getCardBg(card) {
    if (!card || !card.isConnected) return '#F5F5F0';
    return getComputedStyle(card).backgroundColor;
  }

  function getViewerTarget() {
    const w = vw(), h = vh();
    const fab = MUSIC_FAB.rect();
    const GAP = MUSIC_FAB.gap;

    if (!isDesktop()) {
      const top = fab.bottom + GAP;
      return { left: 0, top, width: w, height: Math.max(200, h - top) };
    }

    const maxW = Math.min(1400, w * 0.92);
    const maxH = Math.min(900,  h * 0.88);

    let left   = Math.round((w - maxW) / 2);
    let top    = Math.round((h - maxH) / 2);
    let width  = Math.round(maxW);
    let height = Math.round(maxH);

    if (left < fab.right + GAP && top < fab.bottom + GAP) {
      const newTop = fab.bottom + GAP;
      top = newTop;
      height = Math.min(height, Math.max(200, h - newTop - 16));
    }

    return { left, top, width, height };
  }

  function getPluginTarget(manifest) {
    const w = vw(), h = vh();
    const fab = MUSIC_FAB.rect();
    const GAP = MUSIC_FAB.gap;

    const win = (manifest && manifest.window) || {};
    const wantW = Number(win.width)  || 900;
    const wantH = Number(win.height) || 650;

    const desktop = isDesktop();
    const maxW = Math.floor(w * (desktop ? 0.94 : 0.98));
    const maxH = Math.floor(h * (desktop ? 0.9  : 0.94));
    const minW = Math.min(320, maxW);
    const minH = Math.min(280, maxH);

    let width  = Math.max(minW, Math.min(wantW, maxW));
    let height = Math.max(minH, Math.min(wantH, maxH));

    let left = Math.round((w - width) / 2);
    let top  = Math.round((h - height) / 2);

    if (left < fab.right + GAP && top < fab.bottom + GAP) {
      const newTop = fab.bottom + GAP;
      top = newTop;
      height = Math.min(height, Math.max(200, h - newTop - 16));
    }

    return { left, top, width: Math.round(width), height: Math.round(height) };
  }

  function setPanelRect(l, t, w, h) {
    panel.style.left = l + 'px'; panel.style.top = t + 'px';
    panel.style.width = w + 'px'; panel.style.height = h + 'px';
  }
  function setPanelRectInstant(l, t, w, h) {
    const saved = panel.style.transition;
    panel.style.transition = 'none';
    panel.style.left = l + 'px'; panel.style.top = t + 'px';
    panel.style.width = w + 'px'; panel.style.height = h + 'px';
    void panel.offsetWidth;
    panel.style.transition = saved;
  }
  function setPanelRectWithShortTransition(l, t, w, h) {
    const EASE = 'cubic-bezier(.16,1,.3,1)';
    const T = '.32s ' + EASE;
    panel.style.transition =
      'left ' + T + ', top ' + T + ', width ' + T + ', height ' + T;
    panel.style.left = l + 'px'; panel.style.top = t + 'px';
    panel.style.width = w + 'px'; panel.style.height = h + 'px';
    clearTimeout(panel.__shortTimer);
    panel.__shortTimer = setTimeout(() => { panel.style.transition = ''; }, 360);
  }

  function openViewer(card, kind, opts) {
    opts = opts || {};
    if (isOpen) return;
    isOpen = true;
    viewerSubMode = 'list';
    viewerReturnToCenter = true;
    setCloseBtnMode('close');

    const myToken = ++token;
    activeCard = card || null;
    activeKind = kind;
    lastFocus = document.activeElement;

    if (SettingsUI.isOpen) SettingsUI.close();

    const rect = measureCard(card);
    const bg = getCardBg(card);

    stage.className = 'viewer-stage';
    stage.innerHTML = '';

    if (card && card.isConnected) {
      card.style.transform = '';
      card.classList.add('is-viewing-source');
    }

    panel.style.transition = 'none';
    panel.style.backgroundColor = bg;
    setPanelRect(rect.left, rect.top, rect.width, rect.height);
    void panel.offsetWidth;
    panel.style.transition = '';

    viewer.style.visibility = 'visible';
    viewer.inert = false;
    viewer.classList.add('is-active');
    document.body.classList.add('is-viewing');
    document.body.style.overflow = 'hidden';

    closeBtn.focus({ preventScroll: true });

    if (kind === 'plugins') {
      stage.classList.add('is-plugin');

      const directPlugin = opts.directPlugin || null;
      const target = directPlugin ? getPluginTarget(directPlugin) : getViewerTarget();

      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (myToken !== token) return;
        setPanelRect(target.left, target.top, target.width, target.height);
        panel.style.backgroundColor = '';
        stage.classList.add('is-visible');
        closeBtn.classList.add('is-visible');
      }));

      if (directPlugin) {
        setTimeout(() => {
          if (myToken !== token) return;
          launchPlugin(directPlugin, stage, myToken, false);
        }, 260);
      } else {
        PluginCenter.setLaunchHandler(manifest => launchPlugin(manifest, stage, myToken, true));
        PluginCenter.render(stage);
      }
    }
  }

  async function launchPlugin(manifest, container, myToken, returnToCenter) {
    viewerSubMode = 'plugin';
    viewerReturnToCenter = returnToCenter !== false;
    currentPluginManifest = manifest;
    setCloseBtnMode(viewerReturnToCenter ? 'back' : 'close');

    const t = getPluginTarget(manifest);
    setPanelRect(t.left, t.top, t.width, t.height);

    container.innerHTML = '';
    const loading = document.createElement('div');
    loading.className = 'plugin-loading';
    loading.innerHTML =
      '<div class="plugin-loading__name">' + escapeHTML(manifest.name) + '</div>'
      + '<div class="plugin-loading__stage">初始化…</div>'
      + '<div class="plugin-loading__bar"><div class="plugin-loading__fill"></div></div>'
      + '<div class="plugin-loading__pct">0%</div>';
    container.appendChild(loading);

    const stageEl = loading.querySelector('.plugin-loading__stage');
    const fill    = loading.querySelector('.plugin-loading__fill');
    const pct     = loading.querySelector('.plugin-loading__pct');

    try {
      const instance = await PluginManager.open(manifest.id, {
        container,
        onProgress({ percent, stage: stageText }) {
          fill.style.width = percent + '%';
          pct.textContent = Math.round(percent) + '%';
          if (stageText) stageEl.textContent = stageText;
        },
        onMessage(msg) {
          if (msg.type === 'notify' && msg.detail) {
            showToast(msg.detail.message, msg.detail.level);
          }
        }
      });

      if (myToken !== token) { PluginManager.close(); return; }

      const el = container.querySelector('.plugin-loading');
      if (el) el.remove();

      if (instance && instance.iframe) {
        instance.iframe.style.width = '100%';
        instance.iframe.style.height = '100%';
      }
    } catch (err) {
      console.error('[vibe] plugin launch failed:', err);
      if (myToken !== token) return;
      viewerSubMode = 'list';
      viewerReturnToCenter = true;
      setCloseBtnMode('close');
      loading.innerHTML =
        '<div class="plugin-fail">'
        + '<div class="plugin-fail__badge">插件加载失败</div>'
        + '<h3>' + escapeHTML(err.message || '未知错误') + '</h3>'
        + '<dl>'
        +   '<dt>CODE</dt><dd><code>' + escapeHTML(err.code || 'PLUGIN_LOAD_FAILED') + '</code></dd>'
        +   '<dt>PLUGIN</dt><dd>' + escapeHTML(manifest.id) + '</dd>'
        + '</dl>'
        + '<button class="plugin-fail__btn" type="button">关闭</button>'
        + '</div>';
      const btn = loading.querySelector('.plugin-fail__btn');
      if (btn) btn.addEventListener('click', () => {
        if (viewerReturnToCenter) returnToPluginCenter();
        else closeViewer();
      });
    }
  }

  function openPluginFromPreview(manifest) {
    if (!manifest) return;
    if (isOpen) { closeViewer(); }
    const card = (pendingShortcutCard && pendingShortcutCard.isConnected)
      ? pendingShortcutCard : null;
    pendingShortcutCard = null;
    setTimeout(() => {
      openViewer(card, 'plugins', { directPlugin: manifest });
    }, 40);
  }

  async function returnToPluginCenter() {
    if (viewerSubMode !== 'plugin') return;
    viewerSubMode = 'list';
    viewerReturnToCenter = true;
    currentPluginManifest = null;
    setCloseBtnMode('close');

    try { await PluginManager.close(); } catch (e) {}

    const t = getViewerTarget();
    setPanelRect(t.left, t.top, t.width, t.height);

    stage.className = 'viewer-stage is-plugin';
    stage.innerHTML = '';

    PluginCenter.setLaunchHandler(manifest => launchPlugin(manifest, stage, token, true));
    PluginCenter.render(stage);

    requestAnimationFrame(() => stage.classList.add('is-visible'));
    closeBtn.classList.add('is-visible');
  }

  function onCloseClick() {
    if (viewerSubMode === 'plugin' && viewerReturnToCenter) {
      returnToPluginCenter();
    } else {
      closeViewer();
    }
  }

  function closeViewer() {
    if (!isOpen) return;
    isOpen = false;
    viewerSubMode = 'list';
    viewerReturnToCenter = true;
    currentPluginManifest = null;
    const myToken = ++token;

    stage.classList.remove('is-visible');
    closeBtn.classList.remove('is-visible');
    document.body.classList.remove('is-viewing');
    document.body.style.overflow = '';
    void document.body.offsetHeight;
    viewer.classList.remove('is-active');

    if (!activeCard || !activeCard.isConnected) {
      finalizeClose(myToken);
      return;
    }

    const rect = measureCard(activeCard);
    const bg = getCardBg(activeCard);
    panel.style.backgroundColor = bg;
    setPanelRect(rect.left, rect.top, rect.width, rect.height);

    let finished = false, timer = null;
    function onEnd(e) {
      if (finished) return;
      if (e.target !== panel) return;
      if (e.propertyName !== 'width' && e.propertyName !== 'height') return;
      finished = true;
      panel.removeEventListener('transitionend', onEnd);
      clearTimeout(timer);
      finalizeClose(myToken);
    }
    panel.addEventListener('transitionend', onEnd);
    timer = setTimeout(() => {
      if (finished) return;
      finished = true;
      panel.removeEventListener('transitionend', onEnd);
      finalizeClose(myToken);
    }, CLOSE_DURATION + 140);
  }

  function finalizeClose(myToken) {
    if (myToken !== token) return;
    if (activeKind === 'plugins') {
      PluginManager.close();
    }
    stage.innerHTML = '';
    stage.className = 'viewer-stage';
    viewer.style.visibility = 'hidden';
    viewer.inert = true;
    panel.style.backgroundColor = '';
    if (activeCard && activeCard.isConnected) {
      activeCard.classList.remove('is-viewing-source');
      activeCard.style.transform = '';
    }
    activeCard = null; activeKind = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    lastFocus = null;
  }

  closeBtn.addEventListener('click', onCloseClick);
  scrim.addEventListener('click', () => {
    if (viewerSubMode === 'plugin' && viewerReturnToCenter) returnToPluginCenter();
    else closeViewer();
  });

  let viewerResizeRaf = 0, viewerResizeTimer = 0;
  function applyViewerRectInstant() {
    if (!isOpen) return;
    let t = null;
    if (activeKind === 'plugins' && viewerSubMode === 'plugin' && currentPluginManifest) {
      t = getPluginTarget(currentPluginManifest);
    }
    if (!t) t = getViewerTarget();
    setPanelRectInstant(t.left, t.top, t.width, t.height);
  }
  window.addEventListener('resize', () => {
    if (!isOpen) return;
    if (viewerResizeRaf) cancelAnimationFrame(viewerResizeRaf);
    viewerResizeRaf = requestAnimationFrame(() => {
      viewerResizeRaf = 0;
      applyViewerRectInstant();
    });
    clearTimeout(viewerResizeTimer);
    viewerResizeTimer = setTimeout(applyViewerRectInstant, 140);
  });

  /* ==========================================================
     17. Continue Modal
     ========================================================== */
  const continueModal  = $('#continueModal');
  const continueScrim  = $('#continueScrim');
  const continueBody   = $('#continueBody');
  let continueLastFocus = null;

  function escAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function renderContinueBody() {
    const c = CONFIG.continue || {};
    const buttons = Array.isArray(c.buttons) ? c.buttons : [];
    const btnsHTML = buttons.map((b, i) => {
      const cls = 'continue-btn' + (i > 0 ? ' continue-btn--secondary' : '');

      if (b.action) {
        return '<button class="' + cls + '" type="button" data-action="' + escAttr(b.action) + '">'
             + escAttr(b.text) + ' →</button>';
      }

      const t = b.target || '_blank';
      const rel = t === '_blank' ? ' rel="noopener noreferrer"' : '';
      return '<a class="' + cls + '" href="' + escAttr(b.url) + '" target="' + escAttr(t) + '"' + rel + '>'
           + escAttr(b.text) + ' →</a>';
    }).join('');

    return (
      (c.badge ? '<div class="continue-badge">' + escAttr(c.badge) + '</div>' : '')
      + '<h2 class="continue-title">' + escAttr(c.title || '未完待续') + '</h2>'
      + '<p class="continue-desc">' + escAttr(c.description || '') + '</p>'
      + (btnsHTML ? '<div class="continue-buttons">' + btnsHTML + '</div>' : '')
    );
  }
  function openContinue() {
    if (continueModal.classList.contains('is-open')) return;
    continueLastFocus = document.activeElement;
    if (SettingsUI.isOpen) SettingsUI.close();
    continueBody.innerHTML = renderContinueBody();
    continueModal.inert = false;
    void continueModal.offsetWidth;
    continueModal.classList.add('is-open');
    document.body.classList.add('is-viewing');
    document.body.style.overflow = 'hidden';
    setTimeout(() => {
      if (!continueModal.classList.contains('is-open')) return;
      const btn = $('#continueClose');
      if (btn) btn.focus({ preventScroll: true });
    }, 80);
  }
  function closeContinue() {
    if (!continueModal.classList.contains('is-open')) return;
    if (VideoModal.isOpen()) VideoModal.close();

    continueModal.classList.remove('is-open');
    continueModal.inert = true;
    document.body.classList.remove('is-viewing');
    document.body.style.overflow = '';
    if (continueLastFocus && continueLastFocus.focus) continueLastFocus.focus({ preventScroll: true });
    continueLastFocus = null;
  }
  continueScrim.addEventListener('click', closeContinue);
  $('#continueClose').addEventListener('click', closeContinue);

  continueBody.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    if (btn.dataset.action === 'open-video') {
      e.preventDefault();
      VideoModal.open();
    }
  });

  /* ==========================================================
     17.5 Video Modal（查看更新计划 · 全屏视频）
     ------------------------------------------------------------
     修复要点：
       · src / track 路径都写在 HTML 里，不用 JS 二次编码
       · 视频加载失败时在屏幕上显示具体错误（含错误码 + src）
       · 关闭时暂停并清空 src，释放资源
     ========================================================== */
  const VideoModal = (function () {
    let modal = null, player = null, closeBtn = null, scrim = null, errBox = null;
    let lastFocus = null;
    let ready = false;
    let errorTimer = 0;

    const ERR_TEXT = {
      1: '视频加载被中止（MEDIA_ERR_ABORTED）',
      2: '网络错误，无法下载视频（MEDIA_ERR_NETWORK）—— 检查路径与服务器',
      3: '视频解码失败（MEDIA_ERR_DECODE）—— 浏览器可能不支持该编码',
      4: '视频格式不受支持或文件不存在（MEDIA_ERR_SRC_NOT_SUPPORTED）'
    };

    function init() {
      if (ready) return;
      modal = $('#videoModal');
      if (!modal) return;
      ready = true;

      player   = $('#videoModalPlayer');
      closeBtn = $('#videoModalClose');
      scrim    = $('#videoModalScrim');
      errBox   = $('#videoModalError');

      if (closeBtn) closeBtn.addEventListener('click', close);
      if (scrim)    scrim.addEventListener('click', close);

      if (player) {
        player.addEventListener('loadedmetadata', onLoadedMetadata);
        player.addEventListener('error', onVideoError);
        player.addEventListener('stalled', () => {
          console.warn('[VideoModal] 视频加载停滞：', player.currentSrc || player.src);
        });
        if (player.textTracks && player.textTracks.addEventListener) {
          player.textTracks.addEventListener('addtrack', enableSubtitle);
        }
      }
    }

    function onLoadedMetadata() {
      hideError();
      enableSubtitle();
      console.log('[VideoModal] 元数据已加载：', player.currentSrc || player.src,
                  player.videoWidth + '×' + player.videoHeight);
    }

    function onVideoError() {
      if (!player) return;
      const code = player.error ? player.error.code : 0;
      const src  = player.currentSrc || player.src || '(未设置)';
      const msg  = ERR_TEXT[code] || ('视频加载失败：code ' + code);
      showError(msg, src);
      console.error('[VideoModal]', msg, player.error, src);
    }

    function showError(msg, src) {
      if (!errBox) return;
      errBox.innerHTML =
        '<strong>⚠ 无法播放视频</strong>'
        + escAttr(msg) + '<br>'
        + '<code>' + escAttr(src) + '</code>';
      errBox.classList.add('is-visible');
      clearTimeout(errorTimer);
      errorTimer = setTimeout(hideError, 8000);
    }

    function hideError() {
      if (!errBox) return;
      errBox.classList.remove('is-visible');
      errBox.innerHTML = '';
    }

    function escAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function enableSubtitle() {
      if (!player || !player.textTracks) return;
      const tracks = player.textTracks;
      for (let i = 0; i < tracks.length; i++) {
        const t = tracks[i];
        if (t.kind === 'subtitles' || t.kind === 'captions') {
          try { t.mode = 'showing'; } catch (e) {}
          return;
        }
      }
    }

    function open() {
      if (!ready) init();
      if (!modal) return;
      if (modal.classList.contains('is-open')) return;

      lastFocus = document.activeElement;
      hideError();

      modal.inert = false;
      void modal.offsetWidth;
      modal.classList.add('is-open');
      document.body.classList.add('is-viewing');
      document.body.style.overflow = 'hidden';

      setTimeout(() => {
        if (!modal.classList.contains('is-open')) return;
        if (closeBtn) closeBtn.focus({ preventScroll: true });
      }, 80);

      if (player) {
        try { player.currentTime = 0; } catch (e) {}
        const p = player.play();
        if (p && typeof p.catch === 'function') {
          p.catch(err => {
            console.warn('[VideoModal] 自动播放被拒绝（用户可手动点击播放）：', err && err.message);
          });
        }
      }
    }

    function close() {
      if (!ready || !modal) return;
      if (!modal.classList.contains('is-open')) return;

      modal.classList.remove('is-open');
      modal.inert = true;

      if (player) { try { player.pause(); } catch (e) {} }

      const stillViewing =
        (continueModal && continueModal.classList.contains('is-open')) ||
        (typeof PluginPreview !== 'undefined' && PluginPreview.isOpen());
      if (!stillViewing) {
        document.body.classList.remove('is-viewing');
        document.body.style.overflow = '';
      }

      hideError();

      if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
      lastFocus = null;
    }

    function isOpen() { return !!(modal && modal.classList.contains('is-open')); }

    return { init, open, close, isOpen };
  })();

  /* ==========================================================
     18. 键盘
     ========================================================== */
  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;

    if (VideoModal.isOpen()) VideoModal.close();
    else if (SettingsUI.isOpen) SettingsUI.close();
    else if (PluginPreview.isOpen()) PluginPreview.close();
    else if (continueModal.classList.contains('is-open')) closeContinue();
    else if (isOpen) {
      if (viewerSubMode === 'plugin' && viewerReturnToCenter) returnToPluginCenter();
      else closeViewer();
    }
  });

  /* ==========================================================
     19. 卡片 3D 倾斜
     ========================================================== */
  function initTilt() {
    if (prefersReduced || !isFinePointer) return;
    if (!window.matchMedia('(min-width: 1101px)').matches) return;
    const MAX = 5, LIFT = -3;
    $$('.action-card').forEach(card => {
      if (card.__tiltBound) return;
      card.__tiltBound = true;
      card.style.transformStyle = 'preserve-3d';
      let raf = 0, pending = null;
      function apply() {
        raf = 0;
        if (!pending) return;
        if (card.__tiltLock) { pending = null; return; }
        const { rx, ry } = pending; pending = null;
        card.style.transform =
          'perspective(900px) rotateX(' + rx.toFixed(2) + 'deg) '
          + 'rotateY(' + ry.toFixed(2) + 'deg) translateY(' + LIFT + 'px)';
      }
      card.addEventListener('pointerenter', e => {
        if (e.pointerType !== 'mouse') return;
        if (!SETTINGS.cardMotion) return;
        card.style.transition = 'transform .12s ease-out, box-shadow .18s ease';
      });
      card.addEventListener('pointermove', e => {
        if (e.pointerType !== 'mouse') return;
        if (!SETTINGS.cardMotion) return;
        if (card.__tiltLock) return;
        if (card.classList.contains('is-viewing-source')) return;
        const rect = card.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top)  / rect.height;
        pending = { rx: (y - 0.5) * -MAX * 2, ry: (x - 0.5) * MAX * 2 };
        if (!raf) raf = requestAnimationFrame(apply);
      });
      card.addEventListener('pointerleave', () => {
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        pending = null;
        card.style.transition = 'transform .35s cubic-bezier(.16,1,.3,1), box-shadow .2s ease';
        card.style.transform = '';
      });
    });
  }

  /* ==========================================================
     20. 启动
     ========================================================== */
  SettingsManager.load();
  SettingsUI.init();
  EffectsManager.applyAll();

  MusicPlayer.init(document);
  VideoModal.init();

  ActionGrid.render();

  PluginManager.onChange(() => ActionGrid.render());

  const warmup = () => { PluginManager.discover().catch(() => {}); };
  if ('requestIdleCallback' in window) {
    requestIdleCallback(warmup, { timeout: 2500 });
  } else {
    setTimeout(warmup, 600);
  }

  window.VibeRuntime = {
    PluginManager, PluginShortcutManager, AssetManager, MediaManager,
    MusicPlayer, ActionGrid, PluginPreview, VideoModal,
    API_VERSION
  };

})();
</script>
