<script>
/* ================================================================
   啥都vibe一点 — 插件运行时 2.1
   ----------------------------------------------------------------
   本次更新（2.2）：
     · VideoModal 修复：src 直接写在 HTML，不再用 JS 动态编码
     · 视频加载失败时在屏幕上显示具体错误信息
     · 打开弹窗时不再显式调 load()，交给浏览器按需加载
     · ESC 优先关闭视频

   历史更新（2.1）：
     · 插件 iframe 内部自动滚动、plugin.scroll API

   历史更新（2.0）：
     · 主页面动态插件快捷方式 / manifest window 自定义尺寸
     · 弹窗动画统一 / 关闭按钮统一 / 音乐按钮置顶
   ================================================================ */
(function () {
  'use strict';

  /* ==========================================================
     0. 常量
     ========================================================== */
  const API_VERSION       = '2.0';
  const PLUGIN_ROOT       = 'installed/';
  const DISCOVERY_TIMEOUT = 4000;
  const SETTINGS_KEY      = 'vibe-settings-v1';
  const SHORTCUT_KEY_PFX  = 'vibe.plugin.shortcut.';

  /* ==========================================================
     1. 通用工具
     ========================================================== */
  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isDesktop      = () => window.matchMedia('(min-width: 1101px)').matches;
  const isFinePointer  = window.matchMedia('(pointer: fine)').matches;
  const vw = () => document.documentElement.clientWidth  || window.innerWidth;
  const vh = () => document.documentElement.clientHeight || window.innerHeight;
  const CLOSE_DURATION = 820;

  function escapeHTML(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function withTimeout(promise, ms, fallback) {
    return Promise.race([
      promise,
      new Promise(res => setTimeout(() => res(fallback), ms))
    ]);
  }

  async function fetchJSON(url, opts) {
    const res = await fetch(url, Object.assign({ cache: 'no-cache' }, opts || {}));
    if (!res.ok) throw new Error('HTTP ' + res.status + ' @ ' + url);
    return res.json();
  }

  window.__vibeIconFallback = function (img, letter) {
    if (!img || !img.parentNode) return;
    img.parentNode.textContent = letter || '?';
  };

  /* ==========================================================
     1.2 音乐按钮避让区
     ========================================================== */
  const MUSIC_FAB = {
    size: 52,
    gap: 12,
    inset() {
      return window.matchMedia('(min-width: 761px)').matches ? 32 : 16;
    },
    rect() {
      const off = this.inset();
      return {
        left:   off,
        top:    off,
        right:  off + this.size,
        bottom: off + this.size
      };
    }
  };

  /* ==========================================================
     1.5 音乐播放器（内联版）
     ========================================================== */
  const MusicPlayer = (function () {
    const PLAYLIST_URL = 'music/playlist.json';
    const DEFAULT_PLAYLIST = [
      { title: 'Track 01', src: 'music/track-01.mp3' },
      { title: 'Track 02', src: 'music/track-02.mp3' },
      { title: 'Track 03', src: 'music/track-03.mp3' }
    ];
    let PLAYLIST = DEFAULT_PLAYLIST.slice();
    let playlistLoaded = false;
    let root = null, audio = null, els = {}, currentIndex = -1, ready = false;

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function fmt(t) {
      if (!isFinite(t) || t < 0) t = 0;
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    async function fetchPlaylist() {
      const res = await fetch(PLAYLIST_URL, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const raw = Array.isArray(data)
        ? data
        : (data && Array.isArray(data.tracks) ? data.tracks : null);
      if (!raw) throw new Error('playlist.json 格式错误（应为数组或 { tracks: [...] }）');
      const list = raw.map((item, i) => {
        const file = String(item.file || item.src || '').trim();
        if (!file) return null;
        const clean = file.replace(/^\.?\/?music\//, '');
        return {
          title: String(item.title || ('Track ' + String(i + 1).padStart(2, '0'))),
          src: 'music/' + clean
        };
      }).filter(Boolean);
      if (!list.length) throw new Error('playlist.json 里没有有效条目');
      return list;
    }

    async function loadPlaylist(showResult) {
      try {
        const list = await fetchPlaylist();
        PLAYLIST = list;
        playlistLoaded = true;
        if (currentIndex >= PLAYLIST.length) {
          currentIndex = -1;
          if (els.title) els.title.textContent = '未选择歌曲';
        }
        renderList();
        if (currentIndex >= 0) setActive(currentIndex);
        if (showResult) showToast('歌单已加载（' + PLAYLIST.length + ' 首）', 'info');
        return true;
      } catch (err) {
        console.warn('[music] 无法读取 ' + PLAYLIST_URL + '，使用内置列表：', err.message);
        if (!playlistLoaded) {
          PLAYLIST = DEFAULT_PLAYLIST.slice();
          renderList();
        }
        if (showResult) showToast('歌单加载失败：' + (err.message || '未知错误'), 'warn');
        return false;
      }
    }

    function renderList() {
      if (!els.list) return;
      if (!PLAYLIST.length) {
        els.list.innerHTML = '<div class="mp-list-empty">播放列表为空</div>';
        return;
      }
      els.list.innerHTML = PLAYLIST.map((s, i) =>
        '<button class="mp-item" type="button" role="option" data-index="' + i + '">'
        + '<span class="mp-item__idx">' + (i + 1) + '</span>'
        + '<span class="mp-item__name">' + esc(s.title) + '</span>'
        + '</button>'
      ).join('');
    }

    function setActive(i) {
      currentIndex = i;
      const track = PLAYLIST[i];
      if (els.title) els.title.textContent = track ? track.title : '未选择歌曲';
      if (!els.list) return;
      els.list.querySelectorAll('.mp-item').forEach(it => {
        it.classList.toggle('is-active', Number(it.dataset.index) === i);
      });
    }

    function load(i, autoplay) {
      if (!PLAYLIST.length || i < 0 || i >= PLAYLIST.length) return;
      setActive(i);
      audio.src = PLAYLIST[i].src;
      audio.load();
      if (els.time) els.time.textContent = '0:00 / 0:00';
      if (els.progressFill) els.progressFill.style.width = '0%';
      if (autoplay) play();
    }

    function play() {
      if (!PLAYLIST.length) { showToast('播放列表为空', 'warn'); return; }
      if (currentIndex < 0) { load(0, true); return; }
      audio.play().catch(err => {
        root.classList.remove('is-playing');
        showToast('播放失败：' + (err.message || '未知错误'), 'warn');
      });
    }
    function pause() { audio.pause(); }
    function toggle() { audio.paused ? play() : pause(); }

    function prev() {
      if (!PLAYLIST.length) return;
      const n = PLAYLIST.length;
      load((currentIndex - 1 + n) % n, true);
    }
    function next() {
      if (!PLAYLIST.length) return;
      const n = PLAYLIST.length;
      load((currentIndex + 1) % n, true);
    }

    function setExpanded(v) {
      root.dataset.expanded = v ? 'true' : 'false';
      if (els.fab) els.fab.setAttribute('aria-expanded', String(!!v));
    }
    function toggleList() {
      const open = root.dataset.list === 'open';
      root.dataset.list = open ? 'closed' : 'open';
      if (els.listToggle) els.listToggle.setAttribute('aria-expanded', String(!open));
    }
    function seek(e) {
      if (!audio.duration) return;
      const rect = els.progress.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
    }

    function bind() {
      els.fab        && els.fab.addEventListener('click', () => setExpanded(true));
      els.collapse   && els.collapse.addEventListener('click', () => setExpanded(false));
      els.play       && els.play.addEventListener('click', toggle);
      els.prev       && els.prev.addEventListener('click', prev);
      els.next       && els.next.addEventListener('click', next);
      els.listToggle && els.listToggle.addEventListener('click', toggleList);
      els.progress   && els.progress.addEventListener('click', seek);
      els.reload     && els.reload.addEventListener('click', () => loadPlaylist(true));

      if (els.list) {
        els.list.addEventListener('click', e => {
          const item = e.target.closest('.mp-item');
          if (!item) return;
          load(Number(item.dataset.index), true);
        });
      }

      audio.addEventListener('timeupdate', () => {
        const cur = audio.currentTime || 0;
        const dur = audio.duration || 0;
        if (els.time) els.time.textContent = fmt(cur) + ' / ' + fmt(dur);
        if (els.progressFill && dur > 0) {
          els.progressFill.style.width = (cur / dur * 100) + '%';
        }
      });
      audio.addEventListener('loadedmetadata', () => {
        if (els.time) els.time.textContent = fmt(0) + ' / ' + fmt(audio.duration);
      });
      audio.addEventListener('play',  () => root.classList.add('is-playing'));
      audio.addEventListener('pause', () => root.classList.remove('is-playing'));
      audio.addEventListener('ended', next);
      audio.addEventListener('error', () => {
        root.classList.remove('is-playing');
        if (audio.src) {
          const cur = PLAYLIST[currentIndex];
          showToast('无法播放：' + (cur ? cur.src : '未知文件'), 'warn');
        }
      });
    }

    function init(scope) {
      if (ready) return;
      root = (scope || document).querySelector('#mp');
      if (!root) return;
      els = {
        fab:          root.querySelector('#mpFab'),
        panel:        root.querySelector('#mpPanel'),
        play:         root.querySelector('#mpPlay'),
        prev:         root.querySelector('#mpPrev'),
        next:         root.querySelector('#mpNext'),
        title:        root.querySelector('#mpTitle'),
        time:         root.querySelector('#mpTime'),
        list:         root.querySelector('#mpList'),
        listToggle:   root.querySelector('#mpListToggle'),
        collapse:     root.querySelector('#mpCollapse'),
        reload:       root.querySelector('#mpReload'),
        progress:     root.querySelector('#mpProgress'),
        progressFill: root.querySelector('#mpProgressFill')
      };
      audio = new Audio();
      audio.preload = 'metadata';
      bind();
      renderList();
      ready = true;
      loadPlaylist(false);
    }

    return {
      init, play, pause, toggle, prev, next, load, loadPlaylist,
      get audio() { return audio; },
      get playlist() { return PLAYLIST.slice(); }
    };
  })();

  /* ==========================================================
     2. Toast
     ========================================================== */
  const toastStack = $('#toastStack');
  function showToast(message, level) {
    if (!toastStack || !message) return;
    const el = document.createElement('div');
    el.className = 'toast toast--' + (level || 'info');
    el.textContent = message;
    toastStack.appendChild(el);
    requestAnimationFrame(() => el.classList.add('is-in'));
    setTimeout(() => {
      el.classList.remove('is-in');
      setTimeout(() => el.remove(), 300);
    }, 2600);
  }
  window.__vibeToast = showToast;

  /* ==========================================================
     3. 设置系统
     ========================================================== */
  const DEFAULT_SETTINGS = {
    blobs: true, particles: true, noise: true,
    cardMotion: true, entranceAnimation: true, viewerBlur: true
  };
  let SETTINGS = Object.assign({}, DEFAULT_SETTINGS);

  const SettingsManager = {
    load() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s && typeof s === 'object') SETTINGS = Object.assign({}, DEFAULT_SETTINGS, s);
      } catch (e) {}
    },
    save() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); } catch (e) {} },
    set(k, v) {
      if (!(k in DEFAULT_SETTINGS)) return;
      SETTINGS[k] = !!v; this.save();
      EffectsManager.apply(k);
    },
    reset() {
      SETTINGS = Object.assign({}, DEFAULT_SETTINGS);
      this.save(); EffectsManager.applyAll(); SettingsUI.sync();
    },
    get(k) { return SETTINGS[k]; }
  };

  /* ==========================================================
     4. 特效
     ========================================================== */
  const EffectsManager = {
    apply(k) {
      switch (k) {
        case 'blobs':             this.applyBlobs(); break;
        case 'noise':             this.applyNoise(); break;
        case 'cardMotion':        this.applyCardMotion(); break;
        case 'entranceAnimation': this.applyEntranceAnimation(); break;
        case 'viewerBlur':        this.applyViewerBlur(); break;
        case 'particles':         this.applyParticles(); break;
      }
    },
    applyAll() {
      this.applyBlobs(); this.applyNoise(); this.applyCardMotion();
      this.applyEntranceAnimation(); this.applyViewerBlur(); this.applyParticles();
    },
    applyBlobs()             { document.documentElement.classList.toggle('fx-no-blobs', !SETTINGS.blobs); },
    applyNoise()             { document.documentElement.classList.toggle('fx-no-noise', !SETTINGS.noise); },
    applyCardMotion()        { document.documentElement.classList.toggle('fx-no-card-motion', !SETTINGS.cardMotion); },
    applyEntranceAnimation() { document.documentElement.classList.toggle('fx-no-entrance', !SETTINGS.entranceAnimation); },
    applyViewerBlur()        { document.documentElement.classList.toggle('fx-no-viewer-blur', !SETTINGS.viewerBlur); },
    applyParticles() {
      document.documentElement.classList.toggle('fx-no-particles', !SETTINGS.particles);
      SETTINGS.particles ? ParticleSystem.start() : ParticleSystem.stop();
    }
  };

  /* ==========================================================
     5. 粒子
     ========================================================== */
  const ParticleSystem = (function () {
    const canvas = $('#particles');
    if (!canvas) return { start(){}, stop(){} };
    const ctx = canvas.getContext('2d');
    if (!ctx) return { start(){}, stop(){} };
    const enableMouseForce = isFinePointer && !prefersReduced;
    const REPEL_R = 140, REPEL_R2 = REPEL_R * REPEL_R;
    const mouse = { x: -9999, y: -9999, active: false };
    let W = 0, H = 0, particles = [], rafId = null, running = false, paused = false;
    let mouseBound = false, resizeBound = false, resizeTimer = null;

    function bindMouse() {
      if (mouseBound || !enableMouseForce) return;
      mouseBound = true;
      window.addEventListener('pointermove', e => {
        if (e.pointerType && e.pointerType !== 'mouse') return;
        mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
      }, { passive: true });
      window.addEventListener('pointerleave', () => mouse.active = false);
      window.addEventListener('blur',         () => mouse.active = false);
    }
    function bindResize() {
      if (resizeBound) return;
      resizeBound = true;
      window.addEventListener('resize', () => {
        if (!running) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { resize(); if (paused) drawStatic(); }, 150);
      });
    }
    function spawn(anywhere) {
      const vx = (Math.random() - 0.5) * 0.16;
      const vy = -(Math.random() * 0.3 + 0.08);
      return { x: Math.random() * W, y: anywhere ? Math.random() * H : H + 10,
        r: Math.random() * 1.6 + 0.5, vx, vy, baseVx: vx, baseVy: vy,
        a: Math.random() * 0.35 + 0.08, phase: Math.random() * Math.PI * 2 };
    }
    function build() {
      const max = paused ? 30 : (isFinePointer ? 150 : 110);
      const n = Math.max(24, Math.min(max, Math.floor(W * H / 14000)));
      particles = [];
      for (let i = 0; i < n; i++) particles.push(spawn(true));
    }
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width  = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build();
    }
    function step() {
      ctx.clearRect(0, 0, W, H);
      const useForce = enableMouseForce && mouse.active;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (useForce) {
          const dx = p.x - mouse.x, dy = p.y - mouse.y;
          const d2 = dx*dx + dy*dy;
          if (d2 < REPEL_R2 && d2 > 0.01) {
            const d = Math.sqrt(d2);
            const f = (REPEL_R - d) / REPEL_R;
            p.vx += (dx / d) * f * 0.42;
            p.vy += (dy / d) * f * 0.42;
          }
        }
        p.vx += (p.baseVx - p.vx) * 0.045;
        p.vy += (p.baseVy - p.vy) * 0.045;
        p.x += p.vx; p.y += p.vy; p.phase += 0.02;
        if (p.y < -12) { p.y = H + 12; p.x = Math.random() * W; }
        if (p.x < -12) p.x = W + 12; else if (p.x > W + 12) p.x = -12;
        const a = p.a * (0.65 + 0.35 * Math.sin(p.phase));
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10,10,10,' + a.toFixed(3) + ')'; ctx.fill();
      }
    }
    function drawStatic() {
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10,10,10,' + p.a.toFixed(3) + ')'; ctx.fill();
      });
    }
    function loop() {
      if (!running || paused) return;
      step();
      rafId = requestAnimationFrame(loop);
    }
    function start() {
      if (running) return;
      running = true; paused = prefersReduced;
      bindMouse(); bindResize(); resize();
      if (paused) drawStatic(); else rafId = requestAnimationFrame(loop);
    }
    function stop() {
      if (!running) return;
      running = false;
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = [];
    }
    return { start, stop };
  })();

  /* ==========================================================
     6. AssetManager
     ========================================================== */
  const AssetManager = (function () {
    const imageCache = new Map();
    const blobCache  = new Map();
    const textCache  = new Map();

    function baseURLFor(folder) {
      return new URL(PLUGIN_ROOT + encodeURIComponent(folder) + '/', location.href);
    }

    function resolve(folder, relPath) {
      if (!relPath) return null;
      try {
        const base = baseURLFor(folder);
        if (/(^|\/)\.\.(\/|$)/.test(String(relPath))) return null;
        const url = new URL(relPath, base);
        if (!url.href.startsWith(base.href)) return null;
        return url.href;
      } catch (e) { return null; }
    }

    async function loadImage(folder, relPath) {
      const url = resolve(folder, relPath);
      if (!url) throw new Error('无效的图片路径：' + relPath);
      if (imageCache.has(url)) return imageCache.get(url);
      const img = new Image();
      img.decoding = 'async';
      const p = new Promise((res, rej) => {
        img.onload  = () => res(img);
        img.onerror = () => rej(new Error('图片加载失败：' + relPath));
      });
      img.src = url;
      imageCache.set(url, img);
      await p;
      return img;
    }

    function imageSync(folder, relPath) {
      const url = resolve(folder, relPath);
      if (!url) return null;
      if (imageCache.has(url)) return imageCache.get(url);
      const img = new Image();
      img.decoding = 'async';
      img.src = url;
      imageCache.set(url, img);
      return img;
    }

    async function loadBlob(folder, relPath) {
      const url = resolve(folder, relPath);
      if (!url) throw new Error('无效的资源路径：' + relPath);
      if (blobCache.has(url)) return blobCache.get(url);
      const p = fetch(url).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      });
      blobCache.set(url, p);
      return p;
    }

    async function loadText(folder, relPath) {
      const url = resolve(folder, relPath);
      if (!url) throw new Error('无效的文本路径：' + relPath);
      if (textCache.has(url)) return textCache.get(url);
      const p = fetch(url, { cache: 'no-cache' }).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' @ ' + relPath);
        return r.text();
      });
      textCache.set(url, p);
      return p;
    }

    return { resolve, loadImage, imageSync, loadBlob, loadText };
  })();

  /* ==========================================================
     7. MediaManager
     ========================================================== */
  const MediaManager = (function () {
    const pool = new Set();
    let masterVolume = 1;

    function register(media) { pool.add(media); return media; }
    function unregister(media) { pool.delete(media); }

    function pauseAll() {
      pool.forEach(m => { try { m.pause(); } catch (e) {} });
    }
    function stopAll() {
      pool.forEach(m => {
        try {
          m.pause();
          if (typeof m.currentTime === 'number') m.currentTime = 0;
        } catch (e) {}
      });
      pool.clear();
    }
    function setMasterVolume(v) {
      masterVolume = Math.max(0, Math.min(1, Number(v) || 0));
      pool.forEach(m => { try { m.volume = masterVolume; } catch (e) {} });
    }

    async function playAudio(folder, relPath, opts) {
      opts = opts || {};
      const url = AssetManager.resolve(folder, relPath);
      if (!url) throw new Error('无效的音频路径：' + relPath);
      const a = new Audio(url);
      if (opts.loop)   a.loop = true;
      a.volume = (opts.volume != null ? Math.max(0, Math.min(1, opts.volume)) : 1) * masterVolume;
      register(a);
      a.addEventListener('ended', () => unregister(a), { once: true });
      await a.play();
      return a;
    }

    async function createVideo(folder, relPath, opts) {
      opts = opts || {};
      const url = AssetManager.resolve(folder, relPath);
      if (!url) throw new Error('无效的视频路径：' + relPath);
      const v = document.createElement('video');
      v.src = url;
      v.preload = opts.preload || 'metadata';
      if (opts.loop)     v.loop = true;
      if (opts.muted)    v.muted = true;
      if (opts.controls !== false) v.controls = true;
      v.volume = (opts.volume != null ? opts.volume : 1) * masterVolume;
      v.playsInline = true;
      register(v);
      v.addEventListener('ended', () => { if (!v.loop) unregister(v); }, { once: false });
      return v;
    }

    return {
      playAudio, createVideo, stopAll, pauseAll,
      setMasterVolume, register, unregister,
      getMasterVolume() { return masterVolume; }
    };
  })();

  /* ==========================================================
     8. PluginLoader
     ========================================================== */
  const PluginLoader = (function () {

    function resolveContainer(container, doc) {
      if (!container) return doc.body;
      if (typeof container === 'string') {
        return doc.querySelector(container) || doc.body;
      }
      if (container && container.nodeType === 1) return container;
      return doc.body;
    }

    function applyMediaProps(el, opts) {
      if (!opts) return;
      if (opts.id) el.id = opts.id;
      if (opts.title) el.title = opts.title;
      if (opts.className) {
        el.className = el.className ? (el.className + ' ' + opts.className) : opts.className;
      }
      if (opts.style) {
        if (typeof opts.style === 'object') Object.assign(el.style, opts.style);
        else el.setAttribute('style', opts.style);
      }
      if (opts.width != null)  el.style.width  = typeof opts.width  === 'number' ? opts.width  + 'px' : opts.width;
      if (opts.height != null) el.style.height = typeof opts.height === 'number' ? opts.height + 'px' : opts.height;
      if (opts.dataset && typeof opts.dataset === 'object') {
        for (const k in opts.dataset) el.dataset[k] = opts.dataset[k];
      }
      if (opts.on && typeof opts.on === 'object') {
        for (const ev in opts.on) {
          if (typeof opts.on[ev] === 'function') el.addEventListener(ev, opts.on[ev]);
        }
      }
      if (typeof opts.onClick === 'function') {
        el.addEventListener('click', opts.onClick);
      }
    }

    function createErrorPlaceholder(doc, title, src) {
      const box = doc.createElement('div');
      box.className = 'vibe-media-error';
      const badge = doc.createElement('div');
      badge.className = 'vibe-media-error__badge';
      badge.textContent = title;
      const code = doc.createElement('code');
      code.textContent = src || '';
      box.appendChild(badge);
      box.appendChild(code);
      return box;
    }

    function buildHostAPI(manifest, iframe, container) {
      const folder = manifest._folder;
      const doc    = iframe.contentDocument;

      function el(tag, props, ...children) {
        const node = doc.createElement(tag);
        if (props && typeof props === 'object') {
          for (const k in props) {
            const v = props[k];
            if (v == null) continue;
            if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
            else if (k === 'class' || k === 'className') node.className = v;
            else if (k === 'dataset' && typeof v === 'object') Object.assign(node.dataset, v);
            else if (k.startsWith('on') && typeof v === 'function') {
              node.addEventListener(k.slice(2).toLowerCase(), v);
            } else if (k === 'text') node.textContent = v;
            else if (k === 'html') node.innerHTML = v;
            else node.setAttribute(k, v);
          }
        }
        children.forEach(c => {
          if (c == null) return;
          node.appendChild(typeof c === 'string' ? doc.createTextNode(c) : c);
        });
        return node;
      }

      function imageLoad(src) {
        return AssetManager.loadImage(folder, src);
      }

      function imageCreate(src, opts) {
        opts = opts || {};
        const url = AssetManager.resolve(folder, src);
        if (!url) return Promise.reject(new Error('无效的图片路径：' + src));

        return new Promise((resolve, reject) => {
          const img = doc.createElement('img');
          img.decoding = 'async';
          img.alt = opts.alt || '';
          img.loading = opts.loading || 'eager';
          applyMediaProps(img, opts);
          img.onload  = () => resolve(img);
          img.onerror = () => reject(new Error('图片加载失败：' + src));
          img.src = url;
        });
      }

      async function imageInsert(src, opts) {
        opts = opts || {};
        const container = resolveContainer(opts.container, doc);
        try {
          const img = await imageCreate(src, opts);
          container.appendChild(img);
          return img;
        } catch (err) {
          if (opts.errorPlaceholder !== false) {
            const ph = createErrorPlaceholder(doc, '图片加载失败', src);
            container.appendChild(ph);
            return ph;
          }
          throw err;
        }
      }

      async function imageGallery(items, opts) {
        opts = opts || {};
        const container = resolveContainer(opts.container, doc);
        const wrapper = doc.createElement('div');
        wrapper.className = 'vibe-media-gallery' + (opts.className ? ' ' + opts.className : '');
        if (opts.style) Object.assign(wrapper.style, opts.style);
        container.appendChild(wrapper);

        const list = Array.isArray(items) ? items : [];
        const results = await Promise.all(list.map(item => {
          const src = typeof item === 'string' ? item : (item && (item.src || item.file)) || '';
          const extra = typeof item === 'string' ? {} : item;
          const merged = Object.assign({}, opts, extra, { container: wrapper });
          delete merged.className;
          delete merged.style;
          return imageInsert(src, merged);
        }));
        return { wrapper, items: results };
      }

      async function imageInfo(src) {
        const img = await AssetManager.loadImage(folder, src);
        return { width: img.naturalWidth, height: img.naturalHeight };
      }

      async function videoCreate(src, opts) {
        opts = opts || {};
        const v = await MediaManager.createVideo(folder, src, opts);
        applyMediaProps(v, opts);
        if (opts.waitMetadata !== false) {
          await new Promise(resolve => {
            if (v.readyState >= 1) return resolve();
            let done = false;
            const finish = () => { if (!done) { done = true; resolve(); } };
            v.addEventListener('loadedmetadata', finish, { once: true });
            v.addEventListener('error',          finish, { once: true });
            setTimeout(finish, 5000);
          });
        }
        return v;
      }

      async function videoInsert(src, opts) {
        opts = opts || {};
        const container = resolveContainer(opts.container, doc);
        try {
          const v = await videoCreate(src, opts);
          container.appendChild(v);
          if (opts.autoplay) {
            try { await v.play(); } catch (e) {}
          }
          return v;
        } catch (err) {
          if (opts.errorPlaceholder !== false) {
            const ph = createErrorPlaceholder(doc, '视频加载失败', src);
            container.appendChild(ph);
            return ph;
          }
          throw err;
        }
      }

      async function audioInsert(src, opts) {
        opts = opts || {};
        const url = AssetManager.resolve(folder, src);
        if (!url) throw new Error('无效的音频路径：' + src);

        const a = doc.createElement('audio');
        a.src = url;
        a.preload = opts.preload || 'metadata';
        a.controls = opts.controls !== false;
        if (opts.loop)  a.loop = true;
        if (opts.muted) a.muted = true;
        a.volume = (opts.volume != null ? Math.max(0, Math.min(1, opts.volume)) : 1)
                 * MediaManager.getMasterVolume();

        applyMediaProps(a, opts);
        MediaManager.register(a);

        const container = resolveContainer(opts.container, doc);
        container.appendChild(a);

        if (opts.autoplay) {
          try { await a.play(); } catch (e) {}
        }
        return a;
      }

      async function textRead(src) { return AssetManager.loadText(folder, src); }
      async function textLines(src) {
        const t = await AssetManager.loadText(folder, src);
        return t.split(/\r?\n/);
      }
      async function textJSON(src) {
        const t = await AssetManager.loadText(folder, src);
        return JSON.parse(t);
      }

      function scrollEl() {
        return doc.scrollingElement || doc.documentElement;
      }
      function viewportH() {
        return doc.documentElement.clientHeight || 0;
      }
      function maxTop() {
        return Math.max(0, scrollEl().scrollHeight - viewportH());
      }
      function smoothBehavior(smooth) {
        return (smooth === false || prefersReduced) ? 'auto' : 'smooth';
      }

      const scrollAPI = {
        get top()         { return scrollEl().scrollTop; },
        get height()      { return scrollEl().scrollHeight; },
        get viewport()    { return viewportH(); },
        get max()         { return maxTop(); },
        get hasOverflow() { return maxTop() > 1; },
        el() { return scrollEl(); },
        to(y, smooth) {
          const target = Math.max(0, Math.min(Number(y) || 0, maxTop()));
          const node = scrollEl();
          if (smoothBehavior(smooth) === 'auto') node.scrollTop = target;
          else node.scrollTo({ top: target, behavior: 'smooth' });
        },
        by(dy, smooth) {
          this.to(this.top + (Number(dy) || 0), smooth);
        },
        toTop(smooth)    { this.to(0, smooth); },
        toBottom(smooth) { this.to(this.max, smooth); },
        intoView(node, opts) {
          if (!node || typeof node.scrollIntoView !== 'function') return;
          node.scrollIntoView(Object.assign(
            { behavior: smoothBehavior(true), block: 'nearest' },
            opts || {}
          ));
        }
      };

      const api = {
        id: manifest.id,
        name: manifest.name,
        version: manifest.version,
        apiVersion: API_VERSION,
        manifest,

        toast(msg, level) { showToast(msg, level); },
        notify(msg, level) { showToast(msg, level); },
        log(...args) { console.log('[plugin:' + manifest.id + ']', ...args); },

        assets: {
          resolve:   (p) => AssetManager.resolve(folder, p),
          image:     (p) => AssetManager.loadImage(folder, p),
          imageSync: (p) => AssetManager.imageSync(folder, p),
          blob:      (p) => AssetManager.loadBlob(folder, p),
          text:      (p) => AssetManager.loadText(folder, p),
          audio:     (p) => MediaManager.playAudio(folder, p),
          video:     (p, opts) => MediaManager.createVideo(folder, p, opts)
        },

        image: {
          load:    imageLoad,
          create:  imageCreate,
          insert:  imageInsert,
          gallery: imageGallery,
          info:    imageInfo
        },

        video: {
          load:   videoCreate,
          create: videoCreate,
          insert: videoInsert,
          async play(src, opts) {
            return videoInsert(src, Object.assign({}, opts, { autoplay: true }));
          }
        },

        audio: {
          play(src, opts) { return MediaManager.playAudio(folder, src, opts); },
          insert: audioInsert,
          stopAll() { MediaManager.stopAll(); },
          pauseAll() { MediaManager.pauseAll(); },
          setMasterVolume(v) { MediaManager.setMasterVolume(v); }
        },

        text: {
          read:  textRead,
          lines: textLines,
          json:  textJSON
        },

        ui: {
          el,
          mount(node) { doc.body.appendChild(node); },
          root()  { return doc.body; },
          query(sel) { return doc.querySelector(sel); },
          container(sel) { return resolveContainer(sel, doc); }
        },

        scroll: scrollAPI,

        storage: {
          get(k, fallback) {
            try {
              const v = localStorage.getItem('vibe.plugin.' + manifest.id + '.' + k);
              return v == null ? fallback : JSON.parse(v);
            } catch (e) { return fallback; }
          },
          set(k, v) {
            try { localStorage.setItem('vibe.plugin.' + manifest.id + '.' + k, JSON.stringify(v)); }
            catch (e) {}
          },
          remove(k) {
            try { localStorage.removeItem('vibe.plugin.' + manifest.id + '.' + k); } catch (e) {}
          }
        },

        events: (function () {
          const handlers = Object.create(null);
          return {
            on(name, fn) {
              (handlers[name] || (handlers[name] = [])).push(fn);
              return () => {
                const arr = handlers[name];
                if (!arr) return;
                const i = arr.indexOf(fn);
                if (i >= 0) arr.splice(i, 1);
              };
            },
            off(name, fn) {
              const arr = handlers[name];
              if (!arr) return;
              const i = arr.indexOf(fn);
              if (i >= 0) arr.splice(i, 1);
            },
            emit(name, data) {
              const arr = handlers[name];
              if (!arr) return;
              for (let i = 0; i < arr.length; i++) {
                try { arr[i](data); } catch (e) { console.error(e); }
              }
            }
          };
        })(),

        close() {
          try {
            iframe.contentWindow.parent.postMessage(
              { __vibe: true, type: 'close-request', id: manifest.id }, '*'
            );
          } catch (e) {}
        }
      };

      return api;
    }

    function buildSrcDoc(manifest) {
      const baseHref = new URL(PLUGIN_ROOT + encodeURIComponent(manifest._folder) + '/', location.href).href;
      const entry    = encodeURI(manifest.entry || 'main.js');
      const styleTag = manifest.style
        ? '<link rel="stylesheet" href="./' + encodeURI(manifest.style) + '">'
        : '';

      const allowScroll = !(manifest.window && manifest.window.scroll === false);

      const scrollCSS = allowScroll
        ? 'html{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;'
          + 'overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#0A0A0A #F5F5F0}'
          + '::-webkit-scrollbar{width:12px;height:12px}'
          + '::-webkit-scrollbar-track{background:#F5F5F0;border-left:2px solid #000}'
          + '::-webkit-scrollbar-thumb{background:#0A0A0A;border:2px solid #F5F5F0}'
          + '::-webkit-scrollbar-thumb:hover{background:#FF1493}'
          + '::-webkit-scrollbar-corner{background:#F5F5F0}'
        : 'html{overflow:hidden}';

      return '<!DOCTYPE html><html lang="zh-CN"><head>'
        + '<meta charset="UTF-8">'
        + '<meta name="viewport" content="width=device-width,initial-scale=1.0">'
        + '<base href="' + baseHref + '">'
        + styleTag
        + '<style>'
        + 'html,body{margin:0;padding:0;width:100%;height:100%;'
        + 'font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:transparent;color:#111}'
        + '*,*::before,*::after{box-sizing:border-box}'
        + 'body{display:block;overflow:visible}'
        + scrollCSS
        + 'img{max-width:100%;height:auto;display:block}'
        + 'video{max-width:100%;display:block;background:#000}'
        + 'audio{width:100%;display:block}'
        + '.vibe-media-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));'
        + 'gap:8px;padding:8px}'
        + '.vibe-media-gallery img{width:100%;height:100%;object-fit:cover;border:2px solid #000;'
        + 'box-shadow:2px 2px 0 #000}'
        + '.vibe-media-error{padding:10px 14px;border:2px solid #000;background:#FFB6D9;color:#000;'
        + 'font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;box-shadow:3px 3px 0 #000;'
        + 'display:inline-flex;flex-direction:column;gap:4px;max-width:100%}'
        + '.vibe-media-error__badge{font-weight:700;letter-spacing:.05em}'
        + '.vibe-media-error code{background:#000;color:#FFE135;padding:2px 6px;font-size:11px;'
        + 'word-break:break-all}'
        + '</style>'
        + '</head><body>'
        + '<script type="module">'
        + '(async function(){'
        +   'var PLUGIN_ID=' + JSON.stringify(manifest.id) + ';'
        +   'function report(type,detail){try{parent.postMessage({__vibe:true,type:type,id:PLUGIN_ID,detail:detail||{}},"*");}catch(e){}}'
        +   'window.addEventListener("error",function(e){report("error",{message:e.message,stack:e.error&&e.error.stack});});'
        +   'window.addEventListener("unhandledrejection",function(e){report("error",{message:String(e.reason),stack:e.reason&&e.reason.stack});});'
        +   'try{'
        +     'var mod=await import("./' + entry + '");'
        +     'var run=mod&&(mod.default||mod.run||mod);'
        +     'if(typeof run!=="function"){throw new Error("插件入口必须 export default function(plugin)");}'
        +     'parent.postMessage({__vibe:true,type:"host-request",id:PLUGIN_ID},"*");'
        +     'var host=await new Promise(function(resolve,reject){'
        +       'var done=false;'
        +       'function onMsg(e){'
        +         'if(done)return;'
        +         'if(e.data&&e.data.__vibe===true&&e.data.type==="host-ready"&&e.data.id===PLUGIN_ID){'
        +           'done=true;'
        +           'window.removeEventListener("message",onMsg);'
        +           'resolve(window.__vibeHost);'
        +         '}'
        +       '}'
        +       'window.addEventListener("message",onMsg);'
        +       'setTimeout(function(){'
        +         'if(done)return;'
        +         'done=true;'
        +         'window.removeEventListener("message",onMsg);'
        +         'reject(new Error("宿主未在 5 秒内响应 host-ready"));'
        +       '},5000);'
        +     '});'
        +     'if(!host)throw new Error("宿主 API 未注入");'
        +     'await run(host);'
        +     'report("ready");'
        +   '}catch(err){'
        +     'report("error",{message:(err&&err.message)?err.message:String(err),stack:err&&err.stack});'
        +   '}'
        + '})();'
        + '<\/script>'
        + '</body></html>';
    }

    async function launch(manifest, container, hooks) {
      hooks = hooks || {};
      const onProgress = hooks.onProgress || function () {};
      const onMessage  = hooks.onMessage  || function () {};
      const onReady    = hooks.onReady    || function () {};
      const onError    = hooks.onError    || function () {};

      onProgress({ percent: 8, stage: '准备运行环境…' });

      const iframe = document.createElement('iframe');
      iframe.className = 'plugin-frame';
      iframe.setAttribute('title', manifest.name);
      iframe.srcdoc = buildSrcDoc(manifest);

      let settled = false;
      let readyResolve, readyReject;
      const readyPromise = new Promise((res, rej) => { readyResolve = res; readyReject = rej; });

      let api = null;

      function handleMessage(e) {
        if (e.source !== iframe.contentWindow) return;
        const data = e.data;
        if (!data || data.__vibe !== true || data.id !== manifest.id) return;

        if (data.type === 'host-request') {
          try {
            if (!api) {
              api = buildHostAPI(manifest, iframe, container);
            }
            iframe.contentWindow.__vibeHost = api;
            iframe.contentWindow.postMessage(
              { __vibe: true, type: 'host-ready', id: manifest.id },
              '*'
            );
            onProgress({ percent: 60, stage: '注入运行时 API…' });
          } catch (err) {
            console.error('[vibe] 构建 host API 失败：', err);
            if (!settled) {
              settled = true;
              onError(err);
              readyReject(err);
            }
          }
          return;
        }

        if (data.type === 'ready') {
          if (settled) return;
          settled = true;
          onProgress({ percent: 100, stage: '就绪' });
          onReady();
          readyResolve();
          return;
        }

        if (data.type === 'error') {
          const detail = data.detail || {};
          if (!settled) {
            settled = true;
            const err = new Error(detail.message || '插件运行失败');
            err.stack = detail.stack;
            onError(err);
            readyReject(err);
          } else {
            console.error('[plugin:' + manifest.id + ']', detail.message, detail.stack);
            showToast(manifest.name + ' 运行异常', 'error');
          }
          return;
        }

        if (data.type === 'notify') {
          const d = data.detail || {};
          showToast(d.message || '', d.level || 'info');
          return;
        }

        if (data.type === 'close-request') {
          hooks.onCloseRequest && hooks.onCloseRequest();
          return;
        }

        onMessage(data);
      }
      window.addEventListener('message', handleMessage);

      container.appendChild(iframe);
      onProgress({ percent: 30, stage: '加载插件代码…' });

      function destroy() {
        window.removeEventListener('message', handleMessage);
        try { MediaManager.pauseAll(); } catch (e) {}
        try { iframe.src = 'about:blank'; } catch (e) {}
        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
      }

      return {
        manifest,
        iframe,
        get api() { return api; },
        ready: readyPromise,
        destroy
      };
    }

    return { launch };
  })();

  /* ==========================================================
     9. PluginManager
     ========================================================== */
  const PluginManager = (function () {
    const manifests = new Map();
    let current = null;
    let discoveryPromise = null;
    let lastDiscoverySource = '';
    let listeners = [];

    function emit() {
      const snapshot = list();
      listeners.forEach(fn => { try { fn(snapshot); } catch (e) {} });
    }
    function onChange(fn) {
      listeners.push(fn);
      return () => { listeners = listeners.filter(f => f !== fn); };
    }

    function normalizeWindow(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const w = Number(raw.width);
      const h = Number(raw.height);
      const out = {};
      if (isFinite(w) && w > 0) out.width  = w;
      if (isFinite(h) && h > 0) out.height = h;
      if ('scroll' in raw) out.scroll = raw.scroll !== false;
      return Object.keys(out).length ? out : null;
    }

    function normalizeShortcut(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const out = {};
      if ('enabled' in raw) out.enabled = raw.enabled !== false;
      if (raw.color) out.color = String(raw.color);
      if (raw.icon)  out.icon  = String(raw.icon);
      if (raw.tag)   out.tag   = String(raw.tag);
      return Object.keys(out).length ? out : null;
    }

    function normalize(raw, folderHint) {
      if (!raw || typeof raw !== 'object') return null;
      const id = String(raw.id || folderHint || '').trim();
      if (!id) return null;
      if (!raw.entry) return null;
      if (!/^[A-Za-z0-9._-]+$/.test(id)) return null;
      return {
        id,
        name:        String(raw.name || id),
        version:     String(raw.version || '0.0.0'),
        apiVersion:  String(raw.apiVersion || '1.0'),
        author:      String(raw.author || '未知'),
        description: String(raw.description || ''),
        icon:        raw.icon ? String(raw.icon) : null,
        entry:       String(raw.entry),
        style:       raw.style ? String(raw.style) : null,
        permissions: Array.isArray(raw.permissions) ? raw.permissions.slice() : [],
        window:      normalizeWindow(raw.window),
        shortcut:    normalizeShortcut(raw.shortcut),
        game:        raw.game || null,
        _folder:     String(folderHint || id),
        _source:     raw._source || ''
      };
    }

    async function discoverFromServer() {
      const candidates = ['/api/plugins', 'api/plugins'];
      for (const url of candidates) {
        try {
          const data = await fetchJSON(url);
          if (Array.isArray(data) && data.length) {
            return { source: 'server', items: data };
          }
        } catch (e) {}
      }
      return null;
    }

    async function discoverFromStaticIndex() {
      let list = null;
      for (const url of ['installed/index.json', 'installed/plugins.json']) {
        try { list = await fetchJSON(url); break; }
        catch (e) {}
      }
      if (!Array.isArray(list)) return null;

      if (list.length && typeof list[0] === 'string') {
        const items = await Promise.all(list.map(async name => {
          try {
            const raw = await fetchJSON(
              PLUGIN_ROOT + encodeURIComponent(name) + '/manifest.json'
            );
            return Object.assign({}, raw, { _source: 'static-index' });
          } catch (e) {
            console.warn('[vibe] 插件 manifest 加载失败：', name, e);
            return null;
          }
        }));
        return { source: 'static-index', items: items.filter(Boolean), folderHints: list };
      }

      if (list.length && typeof list[0] === 'object') {
        return { source: 'static-index', items: list };
      }
      return null;
    }

    async function discoverFromRegistryCache() {
      let data = null;
      try { data = await fetchJSON('registry.json'); }
      catch (e) { return null; }

      const list = Array.isArray(data)
        ? data
        : (data && Array.isArray(data.plugins) ? data.plugins : null);
      if (!list || !list.length) return null;

      if (typeof list[0] === 'string') {
        const items = await Promise.all(list.map(async name => {
          try {
            const raw = await fetchJSON(
              PLUGIN_ROOT + encodeURIComponent(name) + '/manifest.json'
            );
            return Object.assign({}, raw, { _source: 'registry-cache' });
          } catch (e) { return null; }
        }));
        return { source: 'registry-cache', items: items.filter(Boolean), folderHints: list };
      }
      if (typeof list[0] === 'object') {
        return { source: 'registry-cache', items: list };
      }
      return null;
    }

    async function discover(force) {
      if (discoveryPromise && !force) return discoveryPromise;
      discoveryPromise = (async () => {
        manifests.clear();
        lastDiscoverySource = '';

        const result =
             await withTimeout(discoverFromServer(),        DISCOVERY_TIMEOUT, null)
          || await withTimeout(discoverFromStaticIndex(),   DISCOVERY_TIMEOUT, null)
          || await withTimeout(discoverFromRegistryCache(), DISCOVERY_TIMEOUT, null);

        if (result) {
          lastDiscoverySource = result.source;
          const hints = result.folderHints || [];
          result.items.forEach((raw, i) => {
            const hint = hints[i] || raw.id;
            const m = normalize(raw, hint);
            if (m) manifests.set(m.id, m);
            else console.warn('[vibe] 忽略无效 manifest：', raw);
          });
        } else {
          lastDiscoverySource = 'none';
        }

        try {
          const valid = new Set(manifests.keys());
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.indexOf(SHORTCUT_KEY_PFX) === 0) {
              const pid = k.slice(SHORTCUT_KEY_PFX.length);
              if (pid && !valid.has(pid)) localStorage.removeItem(k);
            }
          }
        } catch (e) {}

        emit();
        return list();
      })();
      return discoveryPromise;
    }

    function list() {
      return Array.from(manifests.values()).sort((a, b) =>
        a.name.localeCompare(b.name, 'zh-Hans-CN')
      );
    }

    function get(id) { return manifests.get(id) || null; }
    function getDiscoverySource() { return lastDiscoverySource; }

    async function open(id, opts) {
      opts = opts || {};
      const manifest = manifests.get(id);
      if (!manifest) throw new Error('未找到插件：' + id);

      const [major] = manifest.apiVersion.split('.');
      const [hostMajor] = API_VERSION.split('.');
      if (major !== hostMajor) {
        const err = new Error(
          '插件需要 API ' + manifest.apiVersion + '，宿主当前为 ' + API_VERSION
        );
        err.code = 'API_VERSION_MISMATCH';
        throw err;
      }

      await close();

      const container = opts.container;
      if (!container) throw new Error('缺少容器节点');

      try {
        const instance = await PluginLoader.launch(manifest, container, {
          onProgress: opts.onProgress,
          onMessage:  opts.onMessage,
          onCloseRequest: () => close()
        });
        current = instance;
        await instance.ready;
        return instance;
      } catch (err) {
        if (current && current.destroy) {
          try { current.destroy(); } catch (e) {}
          current = null;
        }
        err.code = err.code || 'PLUGIN_LOAD_FAILED';
        throw err;
      }
    }

    async function close() {
      if (!current) return;
      try {
        if (current.api) MediaManager.stopAll();
      } catch (e) {}
      try { current.destroy(); } catch (e) {}
      current = null;
    }

    return {
      discover, list, get, open, close,
      getDiscoverySource,
      onChange
    };
  })();

  /* ==========================================================
     10. PluginShortcutManager
     ========================================================== */
  const SHORTCUT_COLORS = ['yellow', 'pink', 'blue', 'green', 'orange', 'purple'];

  const PluginShortcutManager = {
    key(id) { return SHORTCUT_KEY_PFX + id; },

    isEnabled(manifest) {
      if (!manifest) return false;
      let raw = null;
      try { raw = localStorage.getItem(this.key(manifest.id)); } catch (e) {}
      if (raw === null) {
        return !(manifest.shortcut && manifest.shortcut.enabled === false);
      }
      return raw === 'true';
    },

    setEnabled(id, enabled) {
      try { localStorage.setItem(this.key(id), enabled ? 'true' : 'false'); }
      catch (e) {}
    },

    getColor(manifest, index) {
      const c = manifest && manifest.shortcut && manifest.shortcut.color;
      if (c && SHORTCUT_COLORS.indexOf(c) >= 0) return c;
      return SHORTCUT_COLORS[(index || 0) % SHORTCUT_COLORS.length];
    },

    iconHTML(manifest) {
      if (!manifest) return '?';
      const rel = (manifest.shortcut && manifest.shortcut.icon) || manifest.icon;
      const letter = escapeHTML((manifest.name || '?').charAt(0).toUpperCase());
      if (rel) {
        const url = AssetManager.resolve(manifest._folder, rel);
        if (url) {
          return '<img src="' + escapeHTML(url) + '" alt="" '
            + 'onerror="__vibeIconFallback(this,' + JSON.stringify((manifest.name || '?').charAt(0).toUpperCase()) + ')">';
        }
      }
      return letter;
    },

    list() {
      return PluginManager.list().filter(m => this.isEnabled(m));
    }
  };

  /* ==========================================================
     11. ActionGrid
     ========================================================== */
  const ActionGrid = (function () {
    let grid = null;
    let bound = false;

    const SVG_CENTER =
      '<svg width="32" height="32" viewBox="0 0 30 30" fill="none">'
      + '<path d="M17 2L6 18h8l-3 10 11-16h-8l3-10z" fill="#FFE135" stroke="#000" stroke-width="2" stroke-linejoin="round"/>'
      + '</svg>';

    const SVG_MORE =
      '<svg width="32" height="32" viewBox="0 0 30 30" fill="none">'
      + '<rect x="9" y="3" width="12" height="24" fill="#FF1493" stroke="#000" stroke-width="2"/>'
      + '<rect x="3" y="9" width="24" height="12" fill="#FF1493" stroke="#000" stroke-width="2"/>'
      + '</svg>';

    function shortcutCardHTML(m, index) {
      const color = PluginShortcutManager.getColor(m, index);
      const tag = (m.shortcut && m.shortcut.tag) || 'PLUGIN';
      return (
        '<button class="action-card action-card--' + color + ' action-card--plugin" type="button" '
        + 'data-kind="plugin-shortcut" data-plugin-id="' + escapeHTML(m.id) + '">'
        +   '<span class="card-shape card-shape--plugin" aria-hidden="true">'
        +      PluginShortcutManager.iconHTML(m)
        +   '</span>'
        +   '<span class="card-tag">' + escapeHTML(tag) + ' · ' + String(index + 1).padStart(2, '0') + '</span>'
        +   '<span class="card-name">' + escapeHTML((m.name || m.id).toUpperCase()) + '</span>'
        +   '<span class="card-desc">' + escapeHTML(m.description || '') + '</span>'
        +   '<span class="card-go">OPEN →</span>'
        + '</button>'
      );
    }

    function centerCardHTML(idx) {
      return (
        '<button class="action-card action-card--blue" type="button" data-kind="plugins">'
        +  '<span class="card-shape" aria-hidden="true">' + SVG_CENTER + '</span>'
        +  '<span class="card-tag">PLUGINS · ' + String(idx).padStart(2, '0') + '</span>'
        +  '<span class="card-name">PLUGIN CENTER</span>'
        +  '<span class="card-desc">浏览全部插件</span>'
        +  '<span class="card-go">OPEN →</span>'
        + '</button>'
      );
    }

    function moreCardHTML(idx) {
      return (
        '<button class="action-card action-card--green" type="button" data-kind="continue">'
        +  '<span class="card-shape" aria-hidden="true">' + SVG_MORE + '</span>'
        +  '<span class="card-tag">MORE · ' + String(idx).padStart(2, '0') + '</span>'
        +  '<span class="card-name">ENTER</span>'
        +  '<span class="card-desc">更多内容正在路上</span>'
        +  '<span class="card-go">MORE →</span>'
        + '</button>'
      );
    }

    function bindDelegation() {
      if (bound || !grid) return;
      bound = true;
      grid.addEventListener('click', e => {
        const card = e.target.closest('.action-card');
        if (!card) return;
        const kind = card.dataset.kind;
        if (kind === 'plugin-shortcut') {
          const id = card.dataset.pluginId;
          const m = PluginManager.get(id);
          if (!m) { showToast('插件已不存在', 'warn'); ActionGrid.render(); return; }
          pendingShortcutCard = card;
          PluginPreview.open(m, card);
        } else if (kind === 'plugins') {
          openViewer(card, 'plugins');
        } else if (kind === 'continue') {
          openContinue();
        }
      });
    }

    function render() {
      if (!grid) grid = document.getElementById('actionsGrid');
      if (!grid) return;

      bindDelegation();

      const shortcuts = PluginShortcutManager.list();
      let html = '';
      shortcuts.forEach((m, i) => { html += shortcutCardHTML(m, i); });
      html += centerCardHTML(shortcuts.length + 1);
      html += moreCardHTML(shortcuts.length + 2);

      grid.innerHTML = html;

      const cards = grid.querySelectorAll('.action-card');
      cards.forEach((card, i) => {
        card.style.animationDelay = (0.34 + i * 0.06).toFixed(2) + 's';
      });

      initTilt();
    }

    return { render };
  })();

  /* ==========================================================
     12. PluginPreview
     ========================================================== */
  let pendingShortcutCard = null;

  const PluginPreview = (function () {
    let modal = null, scrim = null, closeBtn = null, body = null;
    let lastFocus = null;
    let currentManifest = null;
    let ready = false;

    function init() {
      if (ready) return;
      modal    = $('#pluginPreview');
      scrim    = $('#pluginPreviewScrim');
      closeBtn = $('#pluginPreviewClose');
      body     = $('#pluginPreviewBody');
      if (!modal) return;
      ready = true;

      if (closeBtn) closeBtn.addEventListener('click', close);
      if (scrim)    scrim.addEventListener('click', close);

      if (body) {
        body.addEventListener('click', e => {
          const openBtn = e.target.closest('[data-action="open-plugin"]');
          if (openBtn && currentManifest) {
            e.preventDefault();
            const m = currentManifest;
            close();
            setTimeout(() => openPluginFromPreview(m), 260);
          }
        });
      }
    }

    function renderBody(m) {
      const icon = PluginShortcutManager.iconHTML(m);
      const tags = [];
      if (m.version)    tags.push('<span class="plugin-tag">v' + escapeHTML(m.version) + '</span>');
      if (m.apiVersion) tags.push('<span class="plugin-tag">api ' + escapeHTML(m.apiVersion) + '</span>');
      (m.permissions || []).slice(0, 4).forEach(p => {
        tags.push('<span class="plugin-tag">' + escapeHTML(p) + '</span>');
      });

      return (
        '<div class="plugin-preview__head">'
        +  '<div class="plugin-preview__icon">' + icon + '</div>'
        +  '<div class="plugin-preview__names">'
        +    '<div class="plugin-preview__title" id="pluginPreviewTitle">' + escapeHTML(m.name) + '</div>'
        +    '<div class="plugin-preview__author">' + escapeHTML(m.author || '未知作者') + '</div>'
        +  '</div>'
        + '</div>'
        + (tags.length ? '<div class="plugin-preview__meta">' + tags.join('') + '</div>' : '')
        + '<div class="plugin-preview__desc">'
        +   escapeHTML(m.description || '这个插件还没有写简介。')
        + '</div>'
        + '<div class="plugin-preview__foot">'
        +   '<button class="plugin-preview__open" type="button" data-action="open-plugin">打开 →</button>'
        + '</div>'
      );
    }

    function open(manifest, card) {
      if (!ready) init();
      if (!modal || !manifest) return;
      if (modal.classList.contains('is-open')) return;

      if (SettingsUI.isOpen) SettingsUI.close();

      currentManifest = manifest;
      lastFocus = document.activeElement;

      body.innerHTML = renderBody(manifest);

      modal.inert = false;
      void modal.offsetWidth;
      modal.classList.add('is-open');
      document.body.classList.add('is-viewing');
      document.body.style.overflow = 'hidden';

      setTimeout(() => {
        if (!modal.classList.contains('is-open')) return;
        const b = modal.querySelector('.plugin-preview__open');
        (b || closeBtn).focus({ preventScroll: true });
      }, 80);
    }

    function close() {
      if (!ready || !modal) return;
      if (!modal.classList.contains('is-open')) return;

      modal.inert = true;
      modal.classList.remove('is-open');
      document.body.classList.remove('is-viewing');
      document.body.style.overflow = '';

      currentManifest = null;
      if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
      lastFocus = null;
    }

    function isOpen() { return !!(modal && modal.classList.contains('is-open')); }

    return { init, open, close, isOpen };
  })();

     ========================================================== */
  const CONFIG = {
    continue: {
      badge: 'SOON',
      title: '未完待续',
      description: '这里的内容还在开发中，敬请期待。',
      buttons: [

        { text: '前往Github主页',    url: 'https://github.com/AlvinUserSaren',      target: '_blank' },
