<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>啥都vibe一点</title>
<meta name="description" content="啥都vibe一点 — 插件化数字游乐场">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<script>
(function () {
  try {
    var raw = localStorage.getItem('vibe-settings-v1');
    if (!raw) return;
    var s = JSON.parse(raw);
    if (!s || typeof s !== 'object') return;
    var root = document.documentElement;
    if (s.blobs === false)             root.classList.add('fx-no-blobs');
    if (s.particles === false)         root.classList.add('fx-no-particles');
    if (s.noise === false)             root.classList.add('fx-no-noise');
    if (s.cardMotion === false)        root.classList.add('fx-no-card-motion');
    if (s.entranceAnimation === false) root.classList.add('fx-no-entrance');
    if (s.viewerBlur === false)        root.classList.add('fx-no-viewer-blur');
  } catch (e) {}
})();
</script>

<style>
/* ============================================================
   NEO-BRUTALISM · 主页面样式
   ============================================================ */
:root{
  --nb-black:#0A0A0A;
  --nb-border:#000000;
  --nb-white:#FFFFFF;
  --nb-light:#F5F5F0;
  --nb-pink:#FF1493;   --nb-pink-bg:#FFB6D9;
  --nb-yellow:#FFE135; --nb-yellow-bg:#FFF4B8;
  --nb-blue:#00BFFF;   --nb-blue-bg:#B3E5FC;
  --nb-green:#32CD32;  --nb-green-bg:#B9F6CA;
  --nb-orange:#FF6B35; --nb-orange-bg:#FFD4BF;
  --nb-purple:#A855F7; --nb-purple-bg:#E9D5FF;
  --b-sm:2px solid var(--nb-border);
  --b-md:3px solid var(--nb-border);
  --b-lg:4px solid var(--nb-border);
  --s-sm:3px 3px 0 var(--nb-border);
  --s-md:5px 5px 0 var(--nb-border);
  --s-lg:7px 7px 0 var(--nb-border);
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --panel-pop-ease:cubic-bezier(.34,1.56,.64,1);
  --panel-pop-duration:.38s;
  --panel-fade-duration:.24s;
  --music-fab-size:52px;
  --music-fab-inset:1rem;
  --music-fab-safe:calc(var(--music-fab-inset) + var(--music-fab-size) + 12px);
}
@media (min-width:761px){
  :root{ --music-fab-inset:2rem; }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{
  min-height:100vh;
  display:flex;flex-direction:column;
  background:var(--nb-light);
  color:var(--nb-black);
  font-family:var(--font-body);
  font-size:1rem;line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--nb-pink);outline-offset:3px}

.bg-layer{
  position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(circle at 18% 12%, rgba(255,225,53,.28), transparent 48%),
    radial-gradient(circle at 82% 78%, rgba(0,191,255,.18), transparent 50%),
    var(--nb-light);
}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform;pointer-events:none}
.blob--1{width:46vmax;height:46vmax;left:-14vmax;top:-14vmax;background:radial-gradient(circle,rgba(255,20,147,.42),transparent 68%);animation:drift1 24s ease-in-out infinite alternate}
.blob--2{width:40vmax;height:40vmax;right:-12vmax;top:6vmax;background:radial-gradient(circle,rgba(0,191,255,.35),transparent 68%);animation:drift2 28s ease-in-out infinite alternate}
.blob--3{width:52vmax;height:52vmax;left:14vmax;bottom:-24vmax;background:radial-gradient(circle,rgba(50,205,50,.28),transparent 68%);animation:drift3 32s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(10vmax,6vmax,0) scale(1.18)}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-12vmax,8vmax,0) scale(.9)}}
@keyframes drift3{from{transform:translate3d(0,0,0) scale(.95)}to{transform:translate3d(-8vmax,-10vmax,0) scale(1.12)}}
#particles{position:absolute;inset:0;display:block;pointer-events:none}
.noise{position:absolute;inset:0;opacity:.05;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/%3E%3C/svg%3E")}

.page{
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(1rem,2.5vw,1.5rem);
  padding:clamp(2rem,5vw,3rem) clamp(1rem,4vw,2rem);
  width:min(1100px,100% - 2rem);margin-inline:auto;
  transition:filter .55s var(--ease),opacity .55s var(--ease);
}
.page-deco{display:flex;justify-content:center;align-items:center;gap:.75rem}
.page-deco svg{display:block;flex-shrink:0}
.deco-line{width:clamp(3rem,10vw,6rem);height:3px;background:var(--nb-black);border:1px solid var(--nb-black)}
.deco-badge{
  font-family:var(--font-mono);font-size:.6875rem;font-weight:700;letter-spacing:.08em;
  padding:.3rem .9rem;border:var(--b-sm);box-shadow:var(--s-sm);
  background:var(--nb-white);color:var(--nb-black);
}
.page-title{text-align:center}
.page-title h1{
  font-family:var(--font-display);
  font-size:clamp(2.5rem,9vw,5.5rem);
  font-weight:800;line-height:1.05;letter-spacing:-.035em;
}
.page-title h1 em{
  font-style:normal;display:inline-block;background:var(--nb-yellow);
  padding:0 .18em;border:var(--b-sm);box-shadow:var(--s-sm);
  transform:rotate(-2deg);margin:0 .05em;
}
.subtitle{
  font-family:var(--font-mono);font-size:clamp(.6875rem,1.6vw,.8125rem);
  letter-spacing:.3em;color:#666;text-align:center;text-transform:uppercase;
}

.actions{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:clamp(1rem,2.2vw,1.35rem);
  width:100%;margin-top:clamp(.75rem,2vw,1.25rem);
}
.action-card{
  position:relative;aspect-ratio:4/3;border:var(--b-md);box-shadow:var(--s-md);
  padding:1.25rem;display:flex;flex-direction:column;justify-content:flex-end;
  cursor:pointer;text-align:left;width:100%;background:var(--nb-white);
  transition:transform .18s ease, box-shadow .18s ease;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
.action-card:hover,.action-card:focus-visible{transform:translate(-3px,-3px);box-shadow:var(--s-lg)}
.action-card:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--nb-border)}
.action-card--yellow{background:var(--nb-yellow-bg)}
.action-card--pink{background:var(--nb-pink-bg)}
.action-card--blue{background:var(--nb-blue-bg)}
.action-card--green{background:var(--nb-green-bg)}
.action-card--orange{background:var(--nb-orange-bg)}
.action-card--purple{background:var(--nb-purple-bg)}
.action-card--plugin{background:var(--nb-white)}
.action-card > *{transition:opacity .34s ease .06s}
.action-card.is-viewing-source{pointer-events:none}
.action-card.is-viewing-source > *{opacity:0;transition:opacity 0s}
.card-shape{
  position:absolute;top:.9rem;right:.9rem;display:block;
  transition:transform .4s var(--ease);z-index:1;
}
.card-shape svg{display:block}
.action-card:hover .card-shape,.action-card:focus-visible .card-shape{transform:rotate(18deg) scale(1.08)}
.card-shape--plugin{
  width:44px;height:44px;
  display:grid;place-items:center;
  background:var(--nb-white);
  border:var(--b-sm);box-shadow:var(--s-sm);
  overflow:hidden;
  font-family:var(--font-display);font-weight:800;font-size:1.25rem;line-height:1;
  color:var(--nb-black);
}
.card-shape--plugin img{width:100%;height:100%;object-fit:cover;display:block}
.action-card:hover .card-shape--plugin,
.action-card:focus-visible .card-shape--plugin{transform:rotate(0) scale(1.06)}
.card-tag{
  position:absolute;top:1rem;left:1rem;
  font-family:var(--font-mono);font-size:.625rem;font-weight:700;letter-spacing:.06em;
  display:inline-block;padding:.15rem .45rem;border:var(--b-sm);
  background:var(--nb-white);color:var(--nb-black);z-index:1;
}
.card-name{
  display:block;
  font-family:var(--font-display);
  font-size:clamp(1.05rem,2.6vw,1.35rem);
  font-weight:800;line-height:1.2;letter-spacing:-.01em;color:var(--nb-black);
}
.card-desc{display:block;font-size:.8125rem;color:#444;margin-top:.15rem;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-go{
  font-family:var(--font-mono);font-size:.625rem;font-weight:700;letter-spacing:.06em;
  margin-top:.7rem;padding:.25rem .6rem;background:var(--nb-black);color:var(--nb-white);
  align-self:flex-start;transition:transform .25s var(--ease);
}
.action-card:hover .card-go{transform:translateX(4px)}

.site-footer{
  position:relative;z-index:1;
  padding:1.5rem 1rem;
  background:var(--nb-black);color:#888;
  font-family:var(--font-mono);font-size:.6875rem;
  text-align:center;letter-spacing:.08em;
  transition:filter .55s var(--ease),opacity .55s var(--ease);
}
body.is-viewing .page,
body.is-viewing .site-footer{filter:blur(8px);opacity:.35;pointer-events:none}

.close-btn{
  display:grid;place-items:center;
  width:42px;height:42px;
  background:var(--nb-pink);color:var(--nb-white);
  border:var(--b-sm);box-shadow:var(--s-sm);
  font-family:var(--font-display);font-weight:800;font-size:1.1rem;line-height:1;
  transition:transform .15s ease, box-shadow .15s ease,
             background .15s ease, color .15s ease;
}
.close-btn:hover{
  background:var(--nb-yellow);color:var(--nb-black);
  transform:translate(-2px,-2px);box-shadow:var(--s-md);
}
.close-btn:active{
  transform:translate(1px,1px);box-shadow:2px 2px 0 var(--nb-border);
}

.viewer{position:fixed;inset:0;z-index:500;pointer-events:none;visibility:hidden}
.viewer.is-active{pointer-events:auto}
.viewer-scrim{
  position:absolute;inset:0;background:rgba(10,10,10,.55);
  opacity:0;cursor:zoom-out;transition:opacity .55s ease .08s;
}
.viewer.is-active .viewer-scrim{opacity:1;transition-delay:0s}
.viewer-panel{
  position:absolute;overflow:hidden;border:var(--b-md);box-shadow:var(--s-md);
  background:var(--nb-light);
  contain:layout style;
  transition:left .78s var(--ease), top .78s var(--ease), width .78s var(--ease), height .78s var(--ease), background-color .42s ease;
}
.viewer-stage{
  position:absolute;inset:0;
  display:grid;place-items:center;
  padding:20px;
  opacity:0;transition:opacity .35s ease .15s;
}
.viewer-stage.is-visible{opacity:1}
.viewer-stage.is-plugin{place-items:stretch;overflow:hidden;padding:0}
.viewer-stage.is-plugin > *{width:100%;height:100%}

.viewer-close{
  position:absolute;top:12px;right:12px;z-index:10;
  opacity:0;transform:scale(.7);
  transition:opacity .28s ease, transform var(--panel-pop-duration) var(--panel-pop-ease),
             background .15s ease, color .15s ease, box-shadow .15s ease;
}
.viewer-close.is-visible{opacity:.85;transform:scale(1)}
.viewer-close.is-visible:hover{
  opacity:1;
  transform:translate(-2px,-2px) scale(1);
}
.viewer-close:active{
  transform:translate(1px,1px) scale(1);
}
.viewer-close.is-back{background:var(--nb-black);color:var(--nb-white);}
.viewer-close.is-back.is-visible:hover{background:var(--nb-yellow);color:var(--nb-black);}

.continue-modal{
  position:fixed;inset:0;z-index:600;display:grid;place-items:center;
  padding:var(--music-fab-safe) 1rem 1rem;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity var(--panel-fade-duration) ease,
             visibility var(--panel-pop-duration) ease;
}
.continue-modal.is-open{opacity:1;visibility:visible;pointer-events:auto}
.continue-scrim{
  position:absolute;inset:0;background:rgba(10,10,10,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;
}
.continue-panel{
  position:relative;width:min(440px, calc(100% - 2rem));
  max-height:calc(100vh - var(--music-fab-safe) - 1rem);
  overflow-y:auto;
  background:var(--nb-white);border:var(--b-lg);box-shadow:10px 10px 0 rgba(0,0,0,.9);
  padding:2.25rem 1.75rem 1.75rem;
  transform:scale(.7);opacity:0;
  transform-origin:center center;
  transition:transform var(--panel-pop-duration) var(--panel-pop-ease),
             opacity var(--panel-fade-duration) ease;
  will-change:transform, opacity;
}
.continue-modal.is-open .continue-panel{transform:scale(1);opacity:1}
.continue-close{
  position:absolute;top:-16px;right:-16px;z-index:5;
}
.continue-badge{
  display:inline-block;font-family:var(--font-mono);font-size:.625rem;font-weight:700;
  letter-spacing:.12em;padding:.25rem .7rem;background:var(--nb-yellow);
  border:var(--b-sm);box-shadow:var(--s-sm);color:var(--nb-black);margin-bottom:.85rem;
}
.continue-title{font-family:var(--font-display);font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:.5rem}
.continue-desc{font-size:.9375rem;color:#555;line-height:1.65;margin-bottom:1.5rem}
.continue-buttons{display:flex;flex-direction:column;gap:.75rem}
.continue-btn{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  width:100%;padding:.85rem 1.25rem;
  font-family:var(--font-display);font-size:.9rem;font-weight:800;
  letter-spacing:.02em;text-align:center;background:var(--nb-pink);color:var(--nb-white);
  border:var(--b-md);box-shadow:var(--s-md);
  cursor:pointer;text-decoration:none;
  transition:transform .15s ease, box-shadow .15s ease;
}
.continue-btn:hover{transform:translate(-3px,-3px);box-shadow:var(--s-lg)}
.continue-btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--nb-border)}
.continue-btn--secondary{background:var(--nb-white);color:var(--nb-black)}

.plugin-preview{
  position:fixed;inset:0;z-index:550;
  display:grid;place-items:center;
  padding:var(--music-fab-safe) 1rem 1rem;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity var(--panel-fade-duration) ease,
             visibility var(--panel-pop-duration) ease;
}
.plugin-preview.is-open{opacity:1;visibility:visible;pointer-events:auto}
.plugin-preview__scrim{
  position:absolute;inset:0;
  background:rgba(10,10,10,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  cursor:pointer;
}
.plugin-preview__panel{
  position:relative;
  width:min(420px, calc(100vw - 2rem));
  max-height:calc(100vh - var(--music-fab-safe) - 1rem);
  display:flex;flex-direction:column;
  background:var(--nb-white);
  border:var(--b-lg);box-shadow:10px 10px 0 rgba(0,0,0,.9);
  padding:1.75rem 1.6rem 1.5rem;
  transform:scale(.7);opacity:0;
  transform-origin:center center;
  transition:transform var(--panel-pop-duration) var(--panel-pop-ease),
             opacity var(--panel-fade-duration) ease;
  will-change:transform, opacity;
}
.plugin-preview.is-open .plugin-preview__panel{transform:scale(1);opacity:1}
#pluginPreviewBody{
  flex:1;
  min-height:0;
  overflow-y:auto;
}
.plugin-preview__close{
  position:absolute;top:-16px;right:-16px;z-index:5;
}
.plugin-preview__head{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.plugin-preview__icon{
  flex-shrink:0;width:64px;height:64px;
  display:grid;place-items:center;
  background:var(--nb-yellow);color:var(--nb-black);
  border:var(--b-md);box-shadow:var(--s-md);
  font-family:var(--font-display);font-weight:800;font-size:1.75rem;line-height:1;
  overflow:hidden;
}
.plugin-preview__icon img{width:100%;height:100%;object-fit:cover;display:block}
.plugin-preview__names{min-width:0;flex:1}
.plugin-preview__title{
  font-family:var(--font-display);font-size:1.3rem;font-weight:800;
  line-height:1.2;letter-spacing:-.02em;word-break:break-word;
}
.plugin-preview__author{
  font-family:var(--font-mono);font-size:.75rem;
  color:#777;letter-spacing:.04em;margin-top:.2rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.plugin-preview__meta{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.9rem}
.plugin-preview__desc{
  font-size:.9rem;color:#444;line-height:1.65;
  padding:1rem 0;
  border-top:2px dashed rgba(0,0,0,.15);
  border-bottom:2px dashed rgba(0,0,0,.15);
  white-space:pre-wrap;word-break:break-word;
}
.plugin-preview__foot{
  display:flex;justify-content:flex-end;align-items:center;
  gap:.75rem;margin-top:1.25rem;
}
.plugin-preview__open{
  padding:.7rem 1.4rem;
  background:var(--nb-pink);color:var(--nb-white);
  border:var(--b-md);box-shadow:var(--s-md);
  font-family:var(--font-display);font-size:.9rem;font-weight:800;
  letter-spacing:.02em;line-height:1;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.plugin-preview__open:hover{transform:translate(-3px,-3px);box-shadow:var(--s-lg)}
.plugin-preview__open:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--nb-border)}

.settings-button{
  position:fixed;z-index:700;
  right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom, 0px));
  width:52px;height:52px;display:grid;place-items:center;
  background:var(--nb-white);color:var(--nb-black);
  border:var(--b-md);box-shadow:var(--s-md);
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease,
             opacity .25s ease, visibility .25s ease;
}
.settings-button:hover{transform:translate(-3px,-3px);box-shadow:var(--s-lg);background:var(--nb-yellow)}
.settings-button:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--nb-border)}
.settings-button svg{transition:transform .5s var(--ease)}
.settings-button.is-open svg{transform:rotate(120deg)}

body.is-viewing .settings-button{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
body.is-viewing .settings-panel{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.settings-panel{
  position:fixed;z-index:800;right:1rem;left:1rem;
  bottom:calc(1rem + env(safe-area-inset-bottom, 0px) + 52px + 12px);
  max-height:70vh;overflow-y:auto;
  background:var(--nb-white);border:var(--b-lg);box-shadow:10px 10px 0 rgba(0,0,0,.9);
  padding:1.25rem;
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(20px) scale(.4);
  transform-origin:calc(100% - 26px) calc(100% + 38px);
  transition:opacity .18s ease, visibility .18s ease, transform .22s cubic-bezier(.4,0,.6,1);
  will-change:transform, opacity;
}
.settings-panel.is-open{
  opacity:1;visibility:visible;pointer-events:auto;
  transform:translateY(0) scale(1);
  transition:opacity .2s ease, visibility 0s, transform .45s cubic-bezier(.34,1.56,.64,1);
}
.settings-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:.75rem;margin-bottom:.35rem;border-bottom:var(--b-md)}
.settings-header h2{font-family:var(--font-display);font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:.5rem}
.settings-header h2::before{content:'';width:10px;height:10px;background:var(--nb-pink);border:2px solid var(--nb-black)}
.settings-close{width:32px;height:32px;display:grid;place-items:center;background:var(--nb-black);color:var(--nb-white);border:var(--b-sm);font-family:var(--font-display);font-weight:800;font-size:.85rem;line-height:1}

.settings-tabs{display:flex;gap:.4rem;margin:.6rem 0 .9rem;flex-wrap:wrap}
.settings-tab{
  padding:.4rem .85rem;font-family:var(--font-display);font-size:.75rem;font-weight:800;
  background:var(--nb-white);border:var(--b-sm);box-shadow:2px 2px 0 var(--nb-border);
}
.settings-tab.is-active{background:var(--nb-black);color:var(--nb-white)}
.settings-view{display:none}
.settings-view.is-active{display:block}

.setting-item{
  position:relative;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;padding:.7rem .15rem;cursor:pointer;user-select:none;
  border-bottom:1px dashed rgba(0,0,0,.14);
}
.setting-item:last-child{border-bottom:none}
.setting-item__text{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.setting-item__text strong{font-family:var(--font-display);font-size:.875rem;font-weight:800}
.setting-item__text small{font-size:.6875rem;color:#777;line-height:1.4}
.setting-input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.setting-switch{position:relative;flex-shrink:0;width:44px;height:26px;background:#d4d4d0;border:var(--b-sm);transition:background .22s ease}
.setting-switch::after{content:'';position:absolute;top:50%;left:2px;width:16px;height:16px;margin-top:-8px;background:var(--nb-white);border:1.5px solid var(--nb-black);transition:transform .24s var(--ease)}
.setting-input:checked ~ .setting-switch{background:var(--nb-green)}
.setting-input:checked ~ .setting-switch::after{transform:translateX(18px)}

.settings-reset{
  display:block;width:100%;margin-top:.85rem;padding:.65rem 1rem;
  background:var(--nb-white);border:var(--b-sm);box-shadow:var(--s-sm);
  font-family:var(--font-display);font-size:.8125rem;font-weight:800;
}
.settings-reset:hover{background:var(--nb-yellow)}

@media (min-width:761px){
  .settings-button{right:2rem;bottom:2rem}
  .settings-panel{
    right:2rem;left:auto;bottom:calc(2rem + 52px + 12px);
    width:420px;max-height:75vh;
  }
}

html.fx-no-blobs .blob{display:none}
html.fx-no-particles #particles{display:none}
html.fx-no-noise .noise{display:none}
html.fx-no-card-motion .action-card,html.fx-no-card-motion .card-shape,html.fx-no-card-motion .card-go{transition:none !important}
html.fx-no-card-motion .action-card:hover,html.fx-no-card-motion .action-card:focus-visible{transform:none !important;box-shadow:var(--s-md) !important}
html.fx-no-card-motion .action-card:active{transform:none !important;box-shadow:var(--s-md) !important}
html.fx-no-entrance .page-deco,html.fx-no-entrance .page-title,html.fx-no-entrance .subtitle,html.fx-no-entrance .actions,html.fx-no-entrance .action-card{animation:none !important}
html.fx-no-viewer-blur body.is-viewing .page,html.fx-no-viewer-blur body.is-viewing .site-footer{filter:none;opacity:1}

@keyframes riseIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.page-deco{animation:riseIn .7s var(--ease) backwards;animation-delay:.05s}
.page-title{animation:riseIn .85s var(--ease) backwards;animation-delay:.13s}
.subtitle{animation:riseIn .85s var(--ease) backwards;animation-delay:.21s}
.actions{animation:riseIn .85s var(--ease) backwards;animation-delay:.29s}
.action-card{animation:riseIn .7s var(--ease) backwards}

@media (max-width:760px){
  .actions{grid-template-columns:1fr;gap:.75rem}
  .action-card{aspect-ratio:auto;flex-direction:row;align-items:center;justify-content:flex-start;gap:.9rem;padding:.95rem 1.05rem}
  .card-shape{position:static;margin-left:auto;order:10;flex-shrink:0;transform:scale(.9)}
  .action-card:hover .card-shape,.action-card:focus-visible .card-shape{transform:scale(.9) rotate(18deg)}
  .action-card:hover .card-shape--plugin,.action-card:focus-visible .card-shape--plugin{transform:scale(.9) rotate(0)}
  .card-shape--plugin{width:40px;height:40px}
  .card-tag{position:static;order:1;flex-shrink:0}
  .card-name{order:2;font-size:1.05rem}
  .card-desc{display:none}
  .card-go{order:9;margin-top:0;flex-shrink:0}
  .continue-panel{padding:2rem 1.35rem 1.35rem}
  .continue-close{top:-12px;right:-12px;width:38px;height:38px;font-size:1rem}
  .plugin-preview__panel{padding:1.5rem 1.25rem 1.25rem}
  .plugin-preview__close{top:-12px;right:-12px;width:38px;height:38px;font-size:1rem}
  .plugin-preview__icon{width:52px;height:52px;font-size:1.4rem}
  .plugin-preview__title{font-size:1.15rem}
  .viewer-close{top:8px;right:8px;width:38px;height:38px;font-size:1rem}
}
@media (max-width:380px){.page-title h1{font-size:2.2rem}.card-tag{display:none}}
@media (min-width:1101px){
  .page{width:min(1200px, calc(100% - 4rem));padding:clamp(3rem,5vw,4rem) 0}
  .page-title h1{font-size:clamp(3.4rem,5vw,4.6rem)}
  .actions{grid-template-columns:repeat(2,1fr);gap:1.25rem;max-width:900px;margin-inline:auto}
  .action-card{aspect-ratio:1.55/1;padding:1.35rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .blob{animation:none !important}
}

.toast-stack{
  position:fixed;z-index:900;left:50%;
  bottom:calc(1rem + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  pointer-events:none;width:min(360px, calc(100% - 2rem));
}
.toast{
  width:100%;padding:.6rem .9rem;
  background:var(--nb-black);color:var(--nb-white);
  border:var(--b-sm);box-shadow:var(--s-sm);
  font-family:var(--font-mono);font-size:.6875rem;font-weight:700;
  letter-spacing:.04em;text-align:center;
  opacity:0;transform:translateY(12px);
  transition:opacity .24s ease, transform .32s var(--ease);
}
.toast.is-in{opacity:1;transform:translateY(0)}
.toast--warn{background:var(--nb-orange)}
.toast--error{background:var(--nb-pink)}

/* ============================================================
   Video Modal（查看更新计划 · 全屏视频）
   ============================================================ */
.video-modal{
  position:fixed;inset:0;z-index:950;
  background:rgba(10,10,10,.96);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity var(--panel-fade-duration) ease,
             visibility var(--panel-pop-duration) ease;
}
.video-modal.is-open{opacity:1;visibility:visible;pointer-events:auto}
.video-modal__scrim{position:absolute;inset:0;cursor:zoom-out}
.video-modal__stage{
  position:absolute;inset:0;
  display:grid;place-items:center;
  padding:calc(62px + env(safe-area-inset-top,0px)) clamp(.75rem,3vw,2.5rem)
          calc(1rem + env(safe-area-inset-bottom,0px));
  pointer-events:none;
}
.video-modal__player{
  width:100%;height:100%;
  max-width:1600px;max-height:100%;
  object-fit:contain;
  background:#000;
  border:var(--b-md);
  box-shadow:6px 6px 0 rgba(255,255,255,.12);
  pointer-events:auto;
  outline:none;
}
.video-modal__player:focus-visible{outline:3px solid var(--nb-pink);outline-offset:3px}
.video-modal__close{
  position:absolute;z-index:5;
  top:calc(1rem + env(safe-area-inset-top,0px));
  right:1rem;
}
/* 视频错误提示（如未找到文件 / 编解码器不支持） */
.video-modal__error{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  max-width:min(520px, calc(100% - 2rem));
  padding:1rem 1.25rem;
  background:var(--nb-pink);
  color:var(--nb-white);
  border:var(--b-md);
  box-shadow:6px 6px 0 rgba(0,0,0,.9);
  font-family:var(--font-mono);
  font-size:.8125rem;
  line-height:1.5;
  letter-spacing:.02em;
  text-align:left;
  word-break:break-word;
  pointer-events:none;
  display:none;
  z-index:6;
}
.video-modal__error.is-visible{display:block}
.video-modal__error strong{display:block;margin-bottom:.35rem;font-family:var(--font-display);font-size:.95rem}
.video-modal__error code{
  display:inline-block;
  background:var(--nb-black);
  color:var(--nb-yellow);
  padding:.1em .4em;
  font-size:.9em;
  margin-top:.2em;
}
@media (min-width:761px){
  .video-modal__close{right:2rem;top:2rem}
  .video-modal__stage{
    padding:calc(84px + env(safe-area-inset-top,0px)) clamp(1.5rem,4vw,3rem) 2rem;
  }
}

/* ============================================================
   PLUGIN CENTER
   ============================================================ */
.plugin-center{
  width:100%;height:100%;
  overflow-y:auto;overflow-x:hidden;
  padding:clamp(1.1rem,2.6vw,1.6rem);
  background:var(--nb-light);
  display:flex;flex-direction:column;gap:1.1rem;
}
.plugin-center__head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:1rem;flex-wrap:wrap;
  padding-bottom:.85rem;border-bottom:var(--b-md);
}
.plugin-center__title{font-family:var(--font-display);font-size:clamp(1.3rem,3vw,1.65rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.plugin-center__sub{font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.14em;color:#777;text-transform:uppercase;margin-top:.2rem}
.plugin-center__actions{display:flex;gap:.5rem;flex-wrap:wrap}
.pc-btn{
  font-family:var(--font-display);font-size:.75rem;font-weight:800;
  padding:.45rem .9rem;background:var(--nb-white);color:var(--nb-black);
  border:var(--b-sm);box-shadow:var(--s-sm);
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
.pc-btn:hover{transform:translate(-2px,-2px);box-shadow:var(--s-md);background:var(--nb-yellow)}
.pc-btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--nb-border)}
.pc-btn--primary{background:var(--nb-pink);color:var(--nb-white)}
.pc-btn--primary:hover{background:var(--nb-pink)}
.pc-btn--ghost{background:transparent;box-shadow:none;border-style:dashed}
.pc-btn--ghost:hover{background:var(--nb-white);box-shadow:var(--s-sm)}

.plugin-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:clamp(.85rem,2vw,1.1rem);
}
.plugin-card{
  position:relative;display:flex;flex-direction:column;gap:.65rem;
  padding:1.05rem;background:var(--nb-white);
  border:var(--b-md);box-shadow:var(--s-md);
  text-align:left;cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease;
  overflow:hidden;
}
.plugin-card:hover,.plugin-card:focus-visible{transform:translate(-3px,-3px);box-shadow:var(--s-lg)}
.plugin-card:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--nb-border)}
.plugin-card__top{display:flex;align-items:center;gap:.8rem;min-width:0}
.plugin-card__icon{
  flex-shrink:0;width:48px;height:48px;
  display:grid;place-items:center;
  background:var(--nb-yellow);color:var(--nb-black);
  border:var(--b-sm);box-shadow:var(--s-sm);
  font-family:var(--font-display);font-weight:800;font-size:1.35rem;line-height:1;
  overflow:hidden;
}
.plugin-card__icon img{width:100%;height:100%;object-fit:cover}
.plugin-card__meta{min-width:0;flex:1}
.plugin-card__name{font-family:var(--font-display);font-weight:800;font-size:1rem;line-height:1.2;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plugin-card__author{font-family:var(--font-mono);font-size:.6875rem;color:#777;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plugin-card__desc{
  font-size:.8125rem;color:#555;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.4em;
}
.plugin-card__tags{display:flex;flex-wrap:wrap;gap:.3rem}
.plugin-tag{
  font-family:var(--font-mono);font-size:.625rem;font-weight:700;letter-spacing:.04em;
  padding:.14rem .45rem;background:var(--nb-light);color:#333;
  border:1.5px solid var(--nb-black);
}
.plugin-tag--warn{background:var(--nb-orange);color:var(--nb-white)}
.plugin-card__foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.15rem}
.plugin-card__version{font-family:var(--font-mono);font-size:.625rem;color:#888;letter-spacing:.06em}
.plugin-card__go{
  font-family:var(--font-mono);font-size:.625rem;font-weight:700;letter-spacing:.06em;
  padding:.25rem .6rem;background:var(--nb-black);color:var(--nb-white);
  transition:transform .25s var(--ease);
}
.plugin-card:hover .plugin-card__go{transform:translateX(4px)}

.plugin-state{
  padding:2rem 1.25rem;text-align:center;
  background:var(--nb-white);border:var(--b-md);box-shadow:var(--s-md);
  display:grid;gap:.55rem;justify-items:center;
}
.plugin-state__title{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.plugin-state__text{font-size:.85rem;color:#666;line-height:1.6;max-width:44ch}
.plugin-state code{font-family:var(--font-mono);font-size:.8em;padding:.15em .45em;background:var(--nb-black);color:var(--nb-yellow)}
.plugin-state pre{
  font-family:var(--font-mono);font-size:.7rem;line-height:1.55;
  background:var(--nb-black);color:#fff;padding:.8rem .9rem;text-align:left;
  overflow-x:auto;max-width:100%;border:var(--b-sm);box-shadow:var(--s-sm);
  white-space:pre;
}
.plugin-scan{
  display:grid;gap:.35rem;justify-items:center;
}
.plugin-scan__spinner{
  width:28px;height:28px;border:3px solid var(--nb-black);border-top-color:transparent;
  border-radius:50%;animation:pcspin .8s linear infinite;
}
@keyframes pcspin{to{transform:rotate(360deg)}}

.plugin-loading{
  width:100%;height:100%;
  display:grid;align-content:center;justify-items:center;gap:.9rem;
  padding:2rem 1.5rem;text-align:center;
  background:var(--nb-light);
}
.plugin-loading__name{
  font-family:var(--font-display);font-size:clamp(1.3rem,3vw,1.7rem);
  font-weight:800;letter-spacing:-.02em;
}
.plugin-loading__stage{
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;
  color:#777;text-transform:uppercase;min-height:1.1em;
}
.plugin-loading__bar{
  width:min(320px,80%);height:14px;background:var(--nb-white);
  border:var(--b-sm);box-shadow:var(--s-sm);overflow:hidden;
}
.plugin-loading__fill{
  height:100%;width:0;background:var(--nb-pink);
  transition:width .35s var(--ease);
}
.plugin-loading__pct{
  font-family:var(--font-mono);font-size:.75rem;font-weight:700;letter-spacing:.1em;
}

.plugin-fail{
  width:100%;height:100%;
  display:grid;align-content:center;justify-items:center;gap:.75rem;
  padding:2rem 1.5rem;text-align:center;background:var(--nb-light);
}
.plugin-fail__badge{
  font-family:var(--font-mono);font-size:.625rem;font-weight:700;letter-spacing:.12em;
  padding:.3rem .8rem;background:var(--nb-pink);color:var(--nb-white);
  border:var(--b-sm);box-shadow:var(--s-sm);
}
.plugin-fail h3{
  font-family:var(--font-display);font-size:1.15rem;font-weight:800;
  max-width:32ch;line-height:1.35;
}
.plugin-fail dl{
  display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;
  font-family:var(--font-mono);font-size:.7rem;text-align:left;
  padding:.85rem 1rem;background:var(--nb-white);
  border:var(--b-sm);box-shadow:var(--s-sm);max-width:100%;
}
.plugin-fail dt{color:#888;letter-spacing:.06em}
.plugin-fail dd{color:var(--nb-black);word-break:break-all}
.plugin-fail code{
  font-family:var(--font-mono);font-size:.95em;padding:.1em .4em;
  background:var(--nb-black);color:var(--nb-yellow);
}
.plugin-fail__btn{
  margin-top:.35rem;padding:.6rem 1.2rem;
  font-family:var(--font-display);font-size:.85rem;font-weight:800;
  background:var(--nb-white);border:var(--b-sm);box-shadow:var(--s-sm);
}
.plugin-fail__btn:hover{background:var(--nb-yellow);transform:translate(-2px,-2px);box-shadow:var(--s-md)}

.plugin-admin{display:grid;gap:.65rem}
.plugin-admin__head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.2rem}
.plugin-admin__title{font-family:var(--font-display);font-weight:800;font-size:.85rem}
.plugin-admin__row{
  display:grid;grid-template-columns:34px 1fr auto;gap:.7rem;align-items:center;
  padding:.55rem .65rem;background:var(--nb-light);
  border:var(--b-sm);
}
.plugin-admin__icon{
  width:34px;height:34px;display:grid;place-items:center;
  background:var(--nb-yellow);border:1.5px solid var(--nb-black);
  font-family:var(--font-display);font-weight:800;font-size:.9rem;overflow:hidden;
}
.plugin-admin__icon img{width:100%;height:100%;object-fit:cover}
.plugin-admin__meta{min-width:0}
.plugin-admin__name{font-family:var(--font-display);font-weight:800;font-size:.8125rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plugin-admin__sub{font-family:var(--font-mono);font-size:.625rem;color:#777;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plugin-admin__toggle{position:relative;display:inline-flex;align-items:center;cursor:pointer;user-select:none;flex-shrink:0}
.plugin-admin__empty{
  padding:1.1rem;text-align:center;font-size:.8125rem;color:#777;
  background:var(--nb-light);border:1.5px dashed var(--nb-black);
}

.plugin-frame{
  display:block;width:100%;height:100%;
  border:0;background:transparent;color-scheme:light;
}

.mp{
  position:fixed;z-index:1000;
  left:1rem;
  top:calc(1rem + env(safe-area-inset-top, 0px));
  width:52px;height:52px;
  font-family:var(--font-body);
}
.mp-fab{
  position:absolute;inset:0;
  width:52px;height:52px;
  display:grid;place-items:center;
  background:var(--nb-white);color:var(--nb-black);
  border:var(--b-md);box-shadow:var(--s-md);
  transform-origin:center;
  cursor:pointer;
  transition:transform var(--panel-pop-duration) var(--panel-pop-ease),
             opacity var(--panel-fade-duration) ease,
             background .15s ease,
             color .15s ease,
             box-shadow .15s ease;
}
.mp-fab:hover{
  transform:translate(-3px,-3px);
  box-shadow:var(--s-lg);
  background:var(--nb-pink);
  color:var(--nb-white);
}
.mp-fab:active{
  transform:translate(1px,1px);
  box-shadow:2px 2px 0 var(--nb-border);
}
.mp[data-expanded="true"] .mp-fab{
  transform:scale(0);
  opacity:0;
  pointer-events:none;
}

.mp-panel{
  position:absolute;
  top:0;left:0;
  width:min(340px, calc(100vw - 2rem));
  background:var(--nb-white);
  border:var(--b-lg);box-shadow:10px 10px 0 rgba(0,0,0,.9);
  overflow:hidden;
  transform-origin:26px 26px;
  transform:scale(.35);
  opacity:0;
  pointer-events:none;
  transition:transform var(--panel-pop-duration) var(--panel-pop-ease),
             opacity var(--panel-fade-duration) ease;
  will-change:transform, opacity;
}
.mp[data-expanded="true"] .mp-panel{
  transform:scale(1);
  opacity:1;
  pointer-events:auto;
}

.mp-bar{
  display:flex;align-items:center;gap:.4rem;
  padding:.55rem .65rem;
  background:var(--nb-black);color:var(--nb-white);
}
.mp-btn{
  width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;
  background:var(--nb-white);color:var(--nb-black);
  border:var(--b-sm);box-shadow:2px 2px 0 var(--nb-white);
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease;
}
.mp-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--nb-white);background:var(--nb-yellow)}
.mp-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--nb-white)}
.mp-btn--play{background:var(--nb-yellow);color:var(--nb-black)}
.mp-icon-pause{display:none}
.mp.is-playing .mp-icon-play{display:none}
.mp.is-playing .mp-icon-pause{display:block}

.mp-info{flex:1;min-width:0;text-align:center;padding:0 .2rem}
.mp-title{
  font-family:var(--font-display);font-size:.75rem;font-weight:800;
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mp-time{
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.06em;
  color:#bbb;margin-top:.15rem;
}
.mp-icon-btn{
  width:26px;height:26px;display:grid;place-items:center;flex-shrink:0;
  background:transparent;color:var(--nb-white);border:none;
  transition:transform .2s var(--ease), color .15s ease;
}
.mp-icon-btn:hover{color:var(--nb-yellow)}
.mp-icon-btn:active{transform:scale(.9)}
.mp[data-list="open"] #mpListToggle svg{transform:rotate(180deg)}
#mpListToggle svg{transition:transform .25s var(--ease)}

.mp-progress{
  height:10px;background:var(--nb-light);
  border-bottom:var(--b-sm);cursor:pointer;position:relative;
  overflow:hidden;
}
.mp-progress__fill{
  height:100%;width:0;background:var(--nb-pink);
  transition:width .12s linear;
}

.mp-list-wrap{
  max-height:0;overflow:hidden;
  transition:max-height .35s var(--ease);
}
.mp[data-list="open"] .mp-list-wrap{max-height:220px;overflow-y:auto}
.mp-list{padding:.4rem;display:flex;flex-direction:column;gap:.3rem}
.mp-item{
  display:flex;align-items:center;gap:.6rem;
  padding:.5rem .6rem;font-size:.78rem;
